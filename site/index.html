/* Give every card its own photo: each home takes the next photo of its community that is not
   already on the page. A photo repeats only when a community has more homes showing than photos. */
function assignPhotos(homes) {
  const used = new Set(), next = {};
  return homes.map(h => {
    const list = PHOTOS[h.community];
    if (!list || !list.length) return null;
    let k = next[h.community] ?? 0, pick = null;
    for (let n = 0; n < list.length && !pick; n++, k++) {
      const p = list[k % list.length];
      if (!used.has(p.url)) pick = p;
    }
    pick = pick || list[(next[h.community] ?? 0) % list.length];          // all used: repeat, in order
    next[h.community] = k;
    used.add(pick.url);
    return pick;
  });
}
const sized = (url, w) => url.replace("/960px-", `/${w}px-`);       // Wikimedia serves fixed thumbnail widths
function photoImg(p, big = false) {
  return p ? `<img class="photo" src="${sized(p.url, big ? 960 : 500)}" alt="${esc(p.place)}" loading="lazy" decoding="async"
    srcset="${sized(p.url, 330)} 330w, ${sized(p.url, 500)} 500w, ${sized(p.url, 960)} 960w"
    sizes="${big ? "(max-width: 480px) 100vw, 420px" : "(max-width: 560px) 100vw, (max-width: 1100px) 45vw, 300px"}"
    onload="this.classList.add('in');this.parentNode.classList.remove('sk')"
    onerror="this.parentNode.classList.remove('sk');this.closest('.home')?.querySelector('.pcredit')?.remove();this.remove()">` : "";
}
function photoCredit(p, community) {
  if (!p) return "";
  const where = p.place.replace(/\s*\(.*\)$/, "").replace(/, Dubai$/, "");
  const label = where.toLowerCase() === community.toLowerCase() ? where : t("nearPlace", { p: where });
  return `<a class="pcredit" href="${p.page}" target="_blank" rel="noopener">${esc(label)} · ${t("photoBy", { a: esc(p.artist) })}${p.license ? ", " + esc(p.license) : ""}</a>`;
}
/* Line drawing of the building: a tower with the sold home's floor filled in, or a villa */
function homePic(h) {
  const villa = String(h.property_type).endsWith("_villa");
  if (villa) return `<svg viewBox="0 0 160 100" aria-hidden="true" fill="none" stroke="var(--line-strong)" stroke-width="1">
      <path d="M24 92h112"/><path d="M48 92V56l32-24 32 24v36"/><path d="M40 62l40-30 40 30"/>
      <rect x="58" y="66" width="12" height="12"/><rect x="90" y="66" width="12" height="12"/><path d="M76 92V74h8v18"/></svg>`;
  const floors = 14, f = h.floor ? Math.min(floors, Math.max(1, Math.round(h.floor / Math.max(h.floor, 40) * floors))) : 0;
  let rows = "";
  for (let k = 1; k <= floors; k++) {
    const y = 90 - k * 5, on = k === f;
    rows += `<rect x="69" y="${y.toFixed(1)}" width="22" height="2" fill="${on ? "var(--text)" : "var(--line)"}" stroke="none"/>`;
    if (on) rows += `<text x="98" y="${(y + 2.5).toFixed(1)}" font-size="7" fill="var(--text)" stroke="none">${h.floor}</text>`;
  }
  return `<svg viewBox="0 0 160 100" aria-hidden="true" fill="none" stroke="var(--line-strong)" stroke-width="1">
      <path d="M24 92h112"/><rect x="65" y="14" width="30" height="78"/><path d="M80 14V8"/>${rows}</svg>`;
}
function renderFind() {
  const d = findState;
  if (!d) { if ($("findResults").getAttribute("aria-busy") !== "true") $("findResults").innerHTML = ""; return; }   // keep the skeleton while loading
  const nf = new Intl.NumberFormat(locale());
  drawFindMap();
  $("findCount").innerHTML = `${t("foundHomes", { n: nf.format(d.total) })}<small>${t("recentSales")}</small>`;
  if (!d.total) { $("findResults").innerHTML = `<p class="empty-note">${t("noHomes")}</p>`; return; }
  let html = "";
  const pics = assignPhotos(d.homes);
  html += `<div class="homes">` + d.homes.map((h, i) => `
    <article class="home">
      <div class="home-pic${pics[i] ? " sk" : ""}">${homePic(h)}${photoImg(pics[i])}<span class="sold">${t("soldOn", { d: monthText(h.date) })}</span><span class="chip-dark">${tv("types", h.property_type)}${h.floor ? " · " + t("floorShort", { f: h.floor }) : ""}</span></div>
      <div class="home-price">${money(h.price_usd)}</div>
      <div class="home-meta">${homeMeta(h)}</div>
      <div class="home-loc"><svg class="icon sm" aria-hidden="true"><use href="#i-pin"/></svg>${h.community}</div>
      <button type="button" class="link" data-i="${i}"><span>${t("estimateThis")}</span><svg class="icon sm flip" aria-hidden="true"><use href="#i-arrow"/></svg></button>
      ${photoCredit(pics[i], h.community)}
    </article>`).join("") + `</div>`;
  if (d.homes.length < d.total) html += `<div class="more"><button type="button" class="btn ghost" id="moreBtn"><span>${t("showMore")}</span></button></div>`;
  html += `<p class="credit">${t("photoNote")}</p>`;
  $("findResults").innerHTML = html;
  $("findResults").querySelectorAll(".home .link").forEach(b => {
    const h = d.homes[+b.dataset.i];
    b.onclick = () => openDrawer(h, pics[+b.dataset.i], b);
    const warm = () => estimateFor(h).catch(() => {});
    b.addEventListener("pointerenter", warm, { once: true });
    b.addEventListener("focus", warm, { once: true });
  });
  if ($("moreBtn")) $("moreBtn").onclick = () => doFind(d.page + 1);
}
$("findForm").addEventListener("submit", e => { e.preventDefault(); doFind(0); });
// the map above the results: matching homes per community; tap one to see only its homes
function drawFindMap() {
  const c = findState?.q.community;
  $("fmHint").innerHTML = c ? `${t("showingArea", { c: esc(c) })} <button type="button" class="link-inline" id="fmAll">${t("showAllAreas")}</button>`
                            : t("whereHint");
  $("fmAll")?.addEventListener("click", () => { $("fCommunity").value = ""; doFind(0); });
  if (!MAPS.find) ensureMaps(); else MAPS.find.refresh();
}
loadPhotos();

/* "Estimate this home": a side panel on the same page with the model's estimate for that home */
let drawerHome = null, drawerPic = null, drawerData = null, drawerOpener = null;
const homeBody = h => ({
  community: h.community, property_type: h.property_type, area_sqft: h.area_sqft,
  floor: h.floor || 10, year_built: Math.min(2023, Math.max(2008, h.year_built)),
  parking_spaces: Math.min(4, Math.max(1, h.parking_spaces)), view: h.view, furnishing: h.furnishing,
  condition: h.condition, chiller_included: h.chiller_included, listing_month: OPT.latest_month,
});
/* Estimates are asked for as soon as the pointer reaches "Estimate this home" (or it gets keyboard focus),
   so the answer is usually ready by the time the panel opens. Each home is only asked for once. */
const estimateCache = new Map();
function estimateFor(h) {
  const key = JSON.stringify(homeBody(h));
  if (!estimateCache.has(key)) {
    const p = fetch("/api/predict", { method: "POST", headers: { "Content-Type": "application/json" }, body: key }).then(r => r.json());
    p.catch(() => estimateCache.delete(key));
    estimateCache.set(key, p);
  }
  return estimateCache.get(key);
}
function openDrawer(h, pic, opener) {
  drawerHome = h; drawerPic = pic; drawerData = null; drawerOpener = opener || document.activeElement;
  $("scrim").hidden = false; $("drawer").hidden = false;
  document.documentElement.classList.add("drawer-open");
  requestAnimationFrame(() => { $("scrim").classList.add("in"); $("drawer").classList.add("in"); });
  renderDrawer();
  $("drawerClose").focus();
  const body = homeBody(h);
  atLeast(estimateFor(h), 150)
    .then(d => { if (drawerHome !== h) return; drawerData = d.error ? { error: d.error } : { ...d, community: h.community, form: body }; renderDrawer(); })
    .catch(err => { if (drawerHome === h) { drawerData = { error: err.message }; renderDrawer(); } });
}
function closeDrawer() {
  if ($("drawer").hidden) return;
  $("scrim").classList.remove("in"); $("drawer").classList.remove("in");
  document.documentElement.classList.remove("drawer-open");
  setTimeout(() => { $("scrim").hidden = true; $("drawer").hidden = true; }, 300);
  drawerHome = null;
  if (drawerOpener && document.contains(drawerOpener)) drawerOpener.focus();
}
function renderDrawer() {
  const h = drawerHome, d = drawerData;
  if (!h) return;
  const top = `
    <div class="home-pic dr-pic${drawerPic ? " sk" : ""}">${homePic(h)}${photoImg(drawerPic, true)}
      <span class="chip-dark">${tv("types", h.property_type)}${h.floor ? " · " + t("floorShort", { f: h.floor }) : ""}</span></div>
    ${drawerPic ? `<div class="dr-credit">${photoCredit(drawerPic, h.community)}</div>` : ""}
    <h3 class="dr-title">${tv("types", h.property_type)} · <bdi>${h.community}</bdi></h3>
    <p class="dr-meta">${homeMeta(h)}</p>
    <div class="dr-sold"><span>${t("soldFor", { d: monthText(h.date) })}</span><b>${money(h.price_usd)}</b></div>`;
  let main;
  if (!d) main = `<div class="dr-est" aria-busy="true">${sk("40%", 12)}${sk("70%", 40, "margin-top:12px")}${sk("55%", 14)}
      <div style="margin:24px 0 8px">${sk("100%", 6)}${sk("46%", 14, "margin:14px auto 0")}</div>${skRow()}${skRow()}</div>`;
  else if (d.error) main = `<p class="error">${t("error")}${esc(d.error)}</p>`;
  else {
    const diff = (h.price_usd / d.price_usd - 1) * 100;
    const verdict = Math.abs(diff) < 3 ? t("soldNear") : t(diff < 0 ? "soldBelow" : "soldAbove", { p: pctAbs0(diff) });
    const moves = d.what_if.slice().sort((a, b) => Math.abs(b.delta_usd) - Math.abs(a.delta_usd)).slice(0, 3);
    main = `<div class="dr-est">
      <div class="label">${t("estToday", { m: monthLabel(OPT.latest_month) })}</div>
      <div class="price">${money(d.price_usd)}</div>
      <p class="dr-verdict ${Math.abs(diff) < 3 ? "" : diff < 0 ? "good" : ""}">${verdict}</p>
      ${rangeBar(d)}
      <div class="stats">${stat("ruler", money(perUnit(d.price_per_sqft_usd)), unit === "m2" ? t("perM2") : t("perSqft"))}
        ${d.similar ? stat("chart", money(d.similar.median), t("similar", { c: h.community })) : ""}</div>
      ${moves.length ? `<h4 class="dr-h">${t("prMoves")}</h4><ul class="dr-moves">${moves.map(w => {
        const [name, value] = wiLabel(w.field, w.value);
        return `<li><span>${value} <small>${name}</small></span><b class="${w.delta_usd > 0 ? "up" : ""}">${signed(w.delta_usd)}</b></li>`; }).join("")}</ul>` : ""}
    </div>`;
  }
  $("drawerBody").innerHTML = top + main;
  // the "full report" button stays fixed at the bottom of the panel while the details scroll
  $("drawerFoot").innerHTML = !d ? sk("100%", 48)
    : d.error ? "" : `<button type="button" class="btn" id="drawerFull"><span>${t("fullReport")}</span><svg class="icon sm flip" aria-hidden="true"><use href="#i-arrow"/></svg></button>`;
  $("drawerFoot").hidden = !!(d && d.error);
  if ($("drawerFull")) $("drawerFull").onclick = () => { const x = drawerHome; closeDrawer(); estimateHome(x); };
}
$("drawerClose").onclick = closeDrawer;
$("scrim").onclick = closeDrawer;
document.addEventListener("keydown", e => {
  if ($("drawer").hidden) return;
  if (e.key === "Escape") return closeDrawer();
  if (e.key === "Tab") {                                       // keep keyboard focus inside the panel
    const f = [...$("drawer").querySelectorAll("button, a[href], input, [tabindex]:not([tabindex='-1'])")].filter(x => x.offsetParent);
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  }
});
/* "Full report" from the panel: the Estimate page with that home's details */
function estimateHome(h) {
  location.hash = "#estimate";
  showPage("estimate", false);
  setCommunity(h.community);
  if (typesFor(h.community).includes(h.property_type)) setType(h.property_type);
  setAreaSqft(h.area_sqft);
  $("floor").value = h.floor || 10;
  $("year_built").value = Math.min(2023, Math.max(2008, h.year_built));
  $("view").value = h.view; $("furnishing").value = h.furnishing; $("condition").value = h.condition;
  $("parking_spaces").value = Math.min(4, Math.max(1, h.parking_spaces));
  $("chiller_included").checked = h.chiller_included;
  goStep(2);
  $("form").requestSubmit();
  setTimeout(() => $("estimatePage").scrollIntoView({ behavior: "smooth", block: "start" }), 50);
}

/* ---- Sell ---- */
let sellLast = null;
function renderSellForm() {
  const c = $("sCommunity").value || "Downtown Dubai", ty = $("sType").value || "2BR";
  $("sCommunity").innerHTML = optionsHTML(Object.keys(OPT.communities), v => v);
  $("sCommunity").value = c;
  fillSellTypes(ty);
  [["sView", OPT.views, "views"], ["sFurn", OPT.furnishing, "furnishing_v"], ["sCond", OPT.conditions, "conditions"]].forEach(([id, vals, g]) => {
    const k = $(id).value; $(id).innerHTML = optionsHTML(vals, v => tv(g, v)); if (k) $(id).value = k;
  });
  if (!$("sView").dataset.init) { $("sView").value = "city"; $("sFurn").value = "unfurnished"; $("sCond").value = "vacant_on_transfer"; $("sView").dataset.init = 1; }
  $("sAreaLabel").textContent = `${t("area")} (${unitWord()})`;
  $("sBoughtLabel").textContent = t("boughtPrice", { c: currency });
  $("sAskLabel").textContent = t("askPrice", { c: currency });
  if (!$("sArea").value) sellTypicalArea();
}
function fillSellTypes(keep) {
  if (keep) sKind = kindOf(keep);
  sKind = drawKind("sKindSeg", "sKindNote", $("sCommunity").value, sKind);
  const types = OPT.types[sKind];
  $("sType").innerHTML = optionsHTML(types, v => tv("types", v));
  $("sType").value = types.includes(keep) ? keep : types[0];
  document.querySelectorAll(".s-apt").forEach(el => el.classList.toggle("hidden", $("sType").value.endsWith("_villa")));
}
function sellTypicalArea() {
  const sq = OPT.typical_area[$("sCommunity").value][$("sType").value];
  if (sq) $("sArea").value = Math.round(unit === "m2" ? sq / SQFT_PER_M2 : sq);
}
$("sCommunity").onchange = () => { fillSellTypes($("sType").value); sellTypicalArea(); };
$("sKindSeg").addEventListener("click", e => {
  const b = e.target.closest("button[data-k]:not([disabled])"); if (!b || b.dataset.k === sKind) return;
  sKind = b.dataset.k; fillSellTypes(null); sellTypicalArea();
});
$("sType").onchange = () => { fillSellTypes($("sType").value); sellTypicalArea(); };
["sArea", "sYear"].forEach(id => $(id).addEventListener("input", () => fieldError(id, "")));

$("sellForm").addEventListener("submit", async e => {
  e.preventDefault();
  const sq = (+$("sArea").value || 0) * (unit === "m2" ? SQFT_PER_M2 : 1), y = +$("sYear").value;
  const [a, b] = unit === "m2" ? [Math.round(200 / SQFT_PER_M2), Math.round(15000 / SQFT_PER_M2)] : [200, 15000];
  const okArea = fieldError("sArea", sq >= 200 && sq <= 15000 ? "" : t("errArea", { a, b, u: unitWord() }));
  const okYear = fieldError("sYear", y >= 2008 && y <= 2023 ? "" : t("errYear"));
  if (!okArea) return $("sArea").focus();
  if (!okYear) return $("sYear").focus();
  const body = {
    community: $("sCommunity").value, property_type: $("sType").value, area_sqft: Math.round(sq),
    floor: $("sFloor").value, year_built: y, view: $("sView").value, furnishing: $("sFurn").value,
    condition: $("sCond").value, parking_spaces: $("sPark").value, chiller_included: true,
    listing_month: OPT.latest_month,
    purchase_price_usd: (+$("sBought").value || 0) / rateOf(), purchase_year: +$("sBoughtYear").value || 0,
    asking_price_usd: (+$("sAsk").value || 0) / rateOf(),
  };
  const btn = $("sellBtn"); btn.disabled = true; btn.classList.add("loading");
  $("sellResults").setAttribute("aria-busy", "true");
  $("sellResults").innerHTML = skelSell();
  try {
    const r = await atLeast(fetch("/api/sell", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }));
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    sellLast = { ...d, community: body.community, years: body.purchase_year };
    renderSell();
    if (window.innerWidth < 900) $("sellResults").scrollIntoView({ behavior: "smooth", block: "start" });
  } catch (err) {
    $("sellResults").innerHTML = `<div class="card"><p class="error">${t("error")}${err.message}</p></div>`;
  } finally { btn.disabled = false; btn.classList.remove("loading"); $("sellResults").setAttribute("aria-busy", "false"); }
});

function renderSell() {
  const d = sellLast;
  if (!d) {
    $("sellResults").innerHTML = `<section class="card"><div class="empty">
      <div class="badge"><svg class="icon" aria-hidden="true"><use href="#i-coins"/></svg></div>
      <h3>${t("sellEmptyTitle")}</h3><p>${t("sellEmptyBody")}</p></div></section>`;
    return;
  }
  const pctAbs = n => new Intl.NumberFormat(locale(), { style: "percent", maximumFractionDigits: 0 }).format(Math.abs(n) / 100);
  let html = `<section class="card">
      <div class="label">${t("marketValue")}</div>
      <div class="big">${money(d.value_usd)}</div>
      <div class="sub">${t("rangeText", { lo: money(d.range_10[0]), hi: money(d.range_10[1]) })}</div>
      <p class="note-line">${t("basedOn", { n: d.comparables.length })}</p>
    </section>`;
  if (d.asking_diff_pct != null) {
    const diff = d.asking_diff_pct, high = diff > 10, low = diff < -5;
    html += `<section class="card"><h3 class="card-title">${t("askTitle")}</h3><div class="verdict" style="margin-top:12px">
      <span class="dir"><svg class="icon" aria-hidden="true"><use href="#i-${high ? "up" : low ? "down" : "check"}"/></svg></span>
      <div><b>${high ? t("askHigh", { p: pctAbs(diff) }) : low ? t("askLow", { p: pctAbs(diff) }) : t("askFair")}</b>
      <p>${high ? t("askHighTip", { v: money(d.value_usd) }) : low ? t("askLowTip", { v: money(d.value_usd) }) : t("askFairTip")}</p></div></div></section>`;
  }
  if (d.profit_usd != null) {
    html += `<section class="card"><h3 class="card-title">${t("profitTitle")}</h3>
      <div class="big">${signed(d.profit_usd)}</div>
      <div class="sub">${t("profitSub", { p: pct(d.profit_pct), a: pct(d.annual_pct) })}</div></section>`;
  }
  const head = { now: t("tNow"), hold: t("tHold"), season: t("tSeason", { s: t(d.best_season) }) }[d.timing];
  const why = { now: t("tNowWhy"), hold: t("tHoldWhy", { s: t(d.best_season) }), season: t("tSeasonWhy", { s: t(d.best_season) }) }[d.timing];
  html += `<section class="card"><h3 class="card-title">${t("whenTitle")}</h3>
      <div class="verdict" style="margin-top:12px"><span class="dir"><svg class="icon" aria-hidden="true"><use href="#i-calendar"/></svg></span>
      <div><b>${head}</b><p>${t("tReason", { c: d.community, p: pct1(d.yoy_pct) })} ${why}</p></div></div>
      <div class="seasons">${["winter", "spring", "summer", "autumn"].map(k => {
        const v = d.seasons[k], top = Math.max(0.1, ...Object.values(d.seasons).map(Math.abs));
        return `<div class="season ${k === d.best_season ? "best" : ""}"><b>${pct1(v)}</b>
          <div class="col"><i class="${v < 0 ? "neg" : ""}" style="height:${(Math.abs(v) / top * 50).toFixed(1)}%"></i></div>
          <div><span>${t(k)}</span><span>${t(k + "M")}</span></div></div>`; }).join("")}</div>
      <p class="note-line">${t("tNote", { s: new Intl.NumberFormat(locale(), { style: "percent", maximumFractionDigits: 1 }).format(d.season_spread / 100) })}</p>
    </section>`;
  html += `<section class="card"><h3 class="card-title"><span class="badge"><svg class="icon" aria-hidden="true"><use href="#i-home"/></svg></span>${t("sellComps")}</h3>
      <div class="tbl-wrap"><table class="tbl"><tr><th>${t("colDate")}</th><th>${t("colSize")}</th><th class="opt">${t("view")}</th><th class="num">${t("colPrice")}</th></tr>` +
      d.comparables.map(c => `<tr><td>${monthText(c.date)}</td><td>${areaText(c.area_sqft)}</td><td class="opt">${tv("views", c.view)}</td><td class="num amt">${money(c.price_usd)}</td></tr>`).join("") +
      `</table></div></section>`;
  $("sellResults").innerHTML = html;
}

/* ---- Keep the new pages in step with language, currency and unit changes ---- */
function refreshPages() {
  if (lastCur !== currency) {                        // convert typed money amounts to the new currency
    const f = (RATES.rates[currency] ?? 1) / (RATES.rates[lastCur] ?? 1);
    ["sBought", "sAsk"].forEach(id => { if ($(id).value) $(id).value = nice(+$(id).value * f); });
    lastCur = currency;
  }
  if (lastUnit !== unit && $("sArea").value) {       // convert the Sell page's area to the new unit
    $("sArea").value = Math.round(lastUnit === "m2" ? +$("sArea").value * SQFT_PER_M2 : +$("sArea").value / SQFT_PER_M2);
  }
  lastUnit = unit;
  renderHero(); renderFindForm(); renderFind(); renderSellForm(); renderSell();
  if (drawerHome) renderDrawer();
  syncCombos();
}

/* ---------------- Start ---------------- */
applyTheme();
$("community").value = "Dubai Marina";
$("communitySearch").value = "Dubai Marina";
applyLang();
$("view").value = "community";                    // sensible starting values
$("furnishing").value = "unfurnished";
$("condition").value = "vacant_on_transfer";
onCommunity();
refreshPages();
showPage(location.hash.slice(1) || "estimate", false);
moveGlider(true);
if (document.fonts) document.fonts.ready.then(() => moveGlider(true));
window.addEventListener("load", () => { initMap(); applyParams(); });

fetch("/api/rates").then(r => r.json()).then(r => {
  RATES = r;
  if (!(currency in RATES.rates)) currency = "USD";
  renderOptions();
  if (last) showResult(last);
  refreshPages();
}).catch(() => {});
</script>
<script>
/* ==================================================================
   3D price city (hero). Every community is a cluster of towers at its
   real location; the tallest tower's height is the community's typical
   price per sq ft. Burj Khalifa marks Downtown. Uses Three.js
   (static/vendor/three.min.js), loaded after the page is ready.
   Drag to turn the city, point at a tower for its numbers, click to
   get an estimate there. Lit windows in dark mode.
   ================================================================== */
(function () {
  const box = document.getElementById("city3d");
  if (!box) return;
  const L = {
    en: { chip: "3D price city", legend: "Tower height = typical price per sq ft", legendM2: "Tower height = typical price per m²",
          low: "Lower", high: "Higher", hint: "Drag to turn · click a tower to estimate", hintTouch: "Swipe to turn · tap a tower",
          loading: "Building the city…", per: "per sq ft", perM2: "per m²", yoy: "1-year change", go: "Click to estimate here",
          goTouch: "Estimate here", burj: "Burj Khalifa", palm: "Palm Jumeirah", marina: "Dubai Marina", aria: "3D model of Dubai: towers show the typical price per square foot in each community",
          burjSub: "828 m · 163 floors", burjTip: "Click to see how prices change with distance", burjTipTouch: "See prices by distance",
          burjKicker: "Price vs distance", burjHead: "Homes within 5 km of Burj Khalifa cost {x}× more per {u} than homes 20–30 km away.",
          burjCol: "Distance", burjColPrice: "Typical price per {u}", band: "{a}–{b} km", bandEnd: "{a}+ km", km: "{a} km",
          sales: "{n} sales", burjNote: "Distance to Burj Khalifa is one of the 25 inputs of our neural network.",
          burjBack: "Back to the city", sqft: "sq ft", m2: "m²" },
    ar: { chip: "مدينة الأسعار ثلاثية الأبعاد", legend: "ارتفاع البرج = متوسط سعر القدم المربع", legendM2: "ارتفاع البرج = متوسط سعر المتر المربع",
          low: "أقل", high: "أعلى", hint: "اسحب للتدوير · انقر على برج لتقدير السعر", hintTouch: "اسحب للتدوير · المس برجاً",
          loading: "جارٍ بناء المدينة…", per: "للقدم المربع", perM2: "للمتر المربع", yoy: "التغير خلال سنة", go: "انقر لتقدير السعر هنا",
          goTouch: "قدّر السعر هنا", burj: "برج خليفة", palm: "نخلة جميرا", marina: "دبي مارينا", aria: "مجسم ثلاثي الأبعاد لدبي: ارتفاع الأبراج يمثل متوسط سعر القدم المربع في كل منطقة",
          burjSub: "828 م · 163 طابقاً", burjTip: "انقر لترى كيف تتغير الأسعار مع المسافة", burjTipTouch: "الأسعار حسب المسافة",
          burjKicker: "السعر والمسافة", burjHead: "المنازل التي تبعد أقل من 5 كم عن برج خليفة أغلى بـ {x} مرة لكل {u} من المنازل التي تبعد 20–30 كم.",
          burjCol: "المسافة", burjColPrice: "متوسط السعر لكل {u}", band: "{a}–{b} كم", bandEnd: "+{a} كم", km: "{a} كم",
          sales: "{n} صفقة", burjNote: "المسافة إلى برج خليفة من المدخلات الـ 25 لشبكتنا العصبية.",
          burjBack: "العودة إلى المدينة", sqft: "قدم مربع", m2: "متر مربع" },
  };
  const curLang = () => (document.documentElement.lang === "ar" || document.documentElement.dir === "rtl" ? "ar" : "en");
  const tr = k => L[curLang()][k];
  const isM2 = () => { try { return typeof unit !== "undefined" && unit === "m2"; } catch (e) { return false; } };
  const touch = matchMedia("(pointer: coarse)").matches;

  function texts() {
    box.querySelector(".c3-stage").setAttribute("aria-label", tr("aria"));
    box.querySelector(".c3-chip span").textContent = tr("chip");
    box.querySelector(".c3-legend b").textContent = isM2() ? tr("legendM2") : tr("legend");
    box.querySelector(".c3-lo").textContent = tr("low");
    box.querySelector(".c3-hi").textContent = tr("high");
    box.querySelector(".c3-hint").textContent = touch ? tr("hintTouch") : tr("hint");
    box.querySelector(".c3-loading span").textContent = tr("loading");
  }
  texts();

  const webgl = (() => { try { const c = document.createElement("canvas"); return !!(window.WebGLRenderingContext && (c.getContext("webgl2") || c.getContext("webgl"))); } catch (e) { return false; } })();
  if (!webgl) { box.classList.add("off"); return; }
  const load = () => {
    const s = document.createElement("script");
    s.src = box.dataset.src; s.async = true;
    s.onload = () => { try { build(); } catch (e) { console.warn("3D city:", e); box.classList.add("off"); } };
    s.onerror = () => box.classList.add("off");
    document.head.appendChild(s);
  };
  if (document.readyState === "complete") (window.requestIdleCallback || (f => setTimeout(f, 150)))(load);
  else window.addEventListener("load", () => (window.requestIdleCallback || (f => setTimeout(f, 150)))(load));

  function build() {
    const T = window.THREE;
    const stage = box.querySelector(".c3-stage");
    const tip = box.querySelector(".c3-tip");
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const small = matchMedia("(max-width: 900px)").matches || touch;
    const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
    const dark = () => document.documentElement.dataset.theme === "dark";

    const renderer = new T.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, small ? 1.5 : 2));
    renderer.shadowMap.enabled = !small;
    renderer.shadowMap.type = T.PCFSoftShadowMap;
    renderer.outputColorSpace = T.SRGBColorSpace;
    renderer.toneMapping = T.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    stage.appendChild(renderer.domElement);

    const scene = new T.Scene();
    const camera = new T.PerspectiveCamera(30, 1, 1, 3000);

    /* --- map projection: 1 scene unit = 0.5 km, north = -z --- */
    const LAT0 = 25.12, LON0 = 55.235;
    const KX = 111.32 * Math.cos(LAT0 * Math.PI / 180) * 2, KZ = 110.57 * 2;
    const px = (lat, lon) => [(lon - LON0) * KX, -(lat - LAT0) * KZ];

    /* --- facade textures: glass + window grid; a second one with random lit windows for the night --- */
    function facade(lit) {
      const c = document.createElement("canvas"); c.width = c.height = 256;
      const g = c.getContext("2d");
      g.fillStyle = lit ? "#000" : "#fff"; g.fillRect(0, 0, 256, 256);
      for (let r = 0; r < 16; r++) for (let k = 0; k < 12; k++) {
        const x = 4 + k * 21, y = 4 + r * 16;
        if (lit) { if (Math.random() < 0.42) { g.fillStyle = `rgba(255,${200 + Math.random() * 40 | 0},${120 + Math.random() * 60 | 0},${0.55 + Math.random() * 0.45})`; g.fillRect(x, y, 15, 10); } }
        else { g.fillStyle = r % 4 === 3 ? "#b9c7cf" : "#cfdae0"; g.fillRect(x, y, 16, 11); }
      }
      const t = new T.CanvasTexture(c);
      t.wrapS = t.wrapT = T.RepeatWrapping; t.colorSpace = lit ? T.NoColorSpace : T.SRGBColorSpace;
      t.anisotropy = 4;
      return t;
    }
    const facadeTex = facade(false), litTex = facade(true);
    const TILE = 9.6;                                        // one texture tile = 9.6 units (16 floors)
    function towerGeo(w, h, d) {
      const g = new T.BoxGeometry(w, h, d); g.translate(0, h / 2, 0);
      const uv = g.attributes.uv;
      for (let f = 0; f < 6; f++) for (let k = 0; k < 4; k++) {
        const i = f * 4 + k; let u = uv.getX(i), v = uv.getY(i);
        if (f === 2 || f === 3) { u = 0.004; v = 0.996; }  // roof: the plain corner of the texture
        else { u *= (f < 2 ? d : w) / TILE * 1.6; v *= h / TILE; }
        uv.setXY(i, u, v);
      }
      return g;
    }

    /* --- lights --- */
    const hemi = new T.HemisphereLight(0xffffff, 0xe8dcc4, 1.0); scene.add(hemi);
    const sun = new T.DirectionalLight(0xfff1dc, 1.6);
    sun.position.set(-60, 110, 50);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    Object.assign(sun.shadow.camera, { left: -80, right: 80, top: 80, bottom: -80, near: 10, far: 400 });
    sun.shadow.bias = -0.0004;
    scene.add(sun);

    /* --- ground: soft shadows, a fine grid and the sea --- */
    const ground = new T.Mesh(new T.CircleGeometry(140, 64), new T.ShadowMaterial({ opacity: 0.14 }));
    ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
    const gridPts = [];
    for (let v = -120; v <= 120; v += 6) { gridPts.push(-120, 0.01, v, 120, 0.01, v, v, 0.01, -120, v, 0.01, 120); }
    const gridGeo = new T.BufferGeometry(); gridGeo.setAttribute("position", new T.Float32BufferAttribute(gridPts, 3));
    const gridMat = new T.LineBasicMaterial({ transparent: true, opacity: 0.35 });
    scene.add(new T.LineSegments(gridGeo, gridMat));
    // coastline (approximate), from Jebel Ali in the south-west to Al Mamzar in the north-east; the sea is north-west of it
    const coast = [[24.95, 54.98], [25.01, 55.05], [25.07, 55.12], [25.10, 55.15], [25.14, 55.19], [25.17, 55.215],
                   [25.20, 55.24], [25.23, 55.26], [25.25, 55.275], [25.27, 55.295], [25.29, 55.31], [25.30, 55.33], [25.33, 55.37], [25.36, 55.40]];
    const sea = new T.Shape();
    coast.forEach(([la, lo], i) => { const [x, z] = px(la, lo); i ? sea.lineTo(x, -z) : sea.moveTo(x, -z); });
    [[25.42, 55.40], [25.42, 54.98], [24.95, 54.98]].forEach(([la, lo]) => { const [x, z] = px(la, lo); sea.lineTo(x, -z); });
    const seaMat = new T.MeshStandardMaterial({ transparent: true, opacity: 0.5, roughness: 0.2, metalness: 0.05, depthWrite: false });
    const seaMesh = new T.Mesh(new T.ShapeGeometry(sea), seaMat);
    seaMesh.rotation.x = -Math.PI / 2; seaMesh.position.y = 0.02; seaMesh.receiveShadow = true; scene.add(seaMesh);

    /* --- communities --- */
    const C = OPT.communities, names = Object.keys(C);
    const sorted = names.map(n => C[n].ppsf).sort((a, b) => a - b);
    const q = [0.2, 0.4, 0.6, 0.8].map(p => sorted[Math.floor(p * (sorted.length - 1))]);
    const level = v => q.filter(b => v > b).length;           // 0..4
    const towerMats = [0, 1, 2, 3, 4].map(() => new T.MeshStandardMaterial({ map: facadeTex, roughness: 0.55, metalness: 0.15 }));
    const hiMat = new T.MeshStandardMaterial({ map: facadeTex, roughness: 0.4, metalness: 0.2 });
    const plotMat = new T.MeshStandardMaterial({ roughness: 0.9 });
    const plotGeo = new T.CylinderGeometry(2.7, 2.9, 0.35, 28);
    const BURJ = [25.19719, 55.27437];
    const [bx, bz] = px(...BURJ);
    let seed = 7; const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

    /* --- where each community's cluster stands ---
       Clusters start at the community's coordinates. Around Burj Khalifa the communities are packed
       tightly, so there: (1) Downtown Dubai, whose centre is the Burj itself, is placed at its typical
       distance from the tower in the sales data; (2) central clusters get a smaller footprint;
       (3) they are nudged apart just enough that no tower stands on the Burj's plaza or on a neighbour. */
    const PLOT = 2.9, KEEP = 2.7, CORE = 10;                  // plot radius, Burj plaza radius, "central" radius
    // Downtown Dubai surrounds the Burj: its towers stand in an arc on the Dubai Mall / Opera side (east to south),
    // at its typical distance from the tower in the sales data (about 1.3 km = 2.6 units)
    const ARC = [-0.45, 1.55], inArc = a => a > ARC[0] - 0.3 && a < ARC[1] + 0.3, ARC_OUT = 4.3;
    const spot = {};
    names.forEach(name => {
      const c = C[name], [x, z] = px(c.lat, c.lon), d = Math.hypot(x - bx, z - bz);
      if (d < 1) spot[name] = { x: bx, z: bz, s: 1, core: false, arc: true };          // the community the Burj stands in
      else spot[name] = { x, z, s: d < 6 ? 0.5 : d < CORE ? 0.7 : 1, core: d < CORE };
    });
    const core = names.filter(n => spot[n].core);
    for (let it = 0; it < 120; it++) {
      core.forEach(n => {                                   // keep the Burj's plaza (and Downtown's arc) clear
        const p = spot[n], dx = p.x - bx, dz = p.z - bz, d = Math.hypot(dx, dz) || 1e-6;
        const need = (inArc(Math.atan2(dz, dx)) ? ARC_OUT : KEEP) + PLOT * p.s;
        if (d < need) { p.x = bx + dx / d * need; p.z = bz + dz / d * need; }
      });
      for (let i = 0; i < names.length; i++) for (let j = i + 1; j < names.length; j++) {
        const a = spot[names[i]], b = spot[names[j]];
        if (a.arc || b.arc || (!a.core && !b.core)) continue;   // only the centre is rearranged
        const dx = b.x - a.x, dz = b.z - a.z, d = Math.hypot(dx, dz) || 1e-6, need = PLOT * (a.s + b.s) + 0.3;
        if (d >= need) continue;
        const push = (need - d) / (a.core && b.core ? 2 : 1), ux = dx / d, uz = dz / d;
        if (a.core) { a.x -= ux * push; a.z -= uz * push; }
        if (b.core) { b.x += ux * push; b.z += uz * push; }
      }
    }

    const groups = {}, growers = [];
    names.forEach(name => {
      const c = C[name]; const { x, z, s: spread, arc } = spot[name];
      const H = 2.4 + c.ppsf * 0.0165;                     // tallest tower: typical price per sq ft
      const villas = (c.categories || []).length === 1 && c.categories[0] === "villa";
      const grp = new T.Group(); grp.position.set(x, 0, z); grp.userData.name = name;
      // the ground under the towers: a round plot, or for Downtown a curved strip around the Burj's plaza
      const plot = arc
        ? new T.Mesh(new T.RingGeometry(KEEP + 0.15, ARC_OUT + 0.1, 32, 1, -ARC[1], ARC[1] - ARC[0]).rotateX(-Math.PI / 2).translate(0, 0.35, 0), plotMat)
        : new T.Mesh(plotGeo, plotMat);
      if (!arc) { plot.position.y = 0.17; plot.scale.set(spread, 1, spread); }
      plot.receiveShadow = true; plot.userData.name = name; grp.add(plot);
      const n = arc ? 9 : villas ? 7 : 3 + Math.floor(rand() * 3);
      const meshes = [];
      const fit = arc ? 0.62 : 0.6 + 0.4 * spread;          // central clusters: slimmer towers, closer together
      for (let i = 0; i < n; i++) {
        let a = rand() * Math.PI * 2, r = i === 0 ? 0 : (0.9 + rand() * 1.15) * spread;
        if (arc) {                                          // spread along the arc; the tallest one in the middle
          const k = i === 0 ? 0.5 : (i - 0.5 + rand() * 0.6) / (n - 1);
          a = ARC[0] + (ARC[1] - ARC[0]) * k; r = KEEP + 0.65 + rand() * (ARC_OUT - KEEP - 1.1);
        }
        const w = (villas ? 0.7 + rand() * 0.3 : 0.75 + rand() * 0.6) * fit, d = (villas ? 0.7 + rand() * 0.3 : 0.75 + rand() * 0.6) * fit;
        const h = i === 0 ? H : H * (villas ? 0.75 + rand() * 0.25 : 0.3 + rand() * 0.5);
        const m = new T.Mesh(towerGeo(w, h, d), towerMats[level(c.ppsf)]);
        m.position.set(Math.cos(a) * r, 0.35, Math.sin(a) * r);
        m.rotation.y = rand() * 0.6;
        m.castShadow = m.receiveShadow = true; m.userData.name = name;
        if (!villas && h > 12) {                               // crown on the tall ones
          const cr = new T.Mesh(towerGeo(w * 0.62, h * 0.09, d * 0.62), m.material);
          cr.position.y = h; cr.castShadow = true; cr.userData.name = name; m.add(cr); meshes.push(cr);
        }
        grp.add(m); meshes.push(m);
        growers.push({ m, delay: Math.hypot(x - bx, z - bz) * 14 + i * 40 });
      }
      grp.userData.meshes = meshes; grp.userData.level = level(c.ppsf);
      groups[name] = grp; scene.add(grp);
    });

    /* --- Burj Khalifa, modelled on the real tower ---
       A hexagonal core with three rounded wings (the "Y" plan), each wing stepping back at
       its own heights so the setbacks spiral upwards, then a slim crown and a long spire.
       Silver glass with vertical fins, reflecting a soft sky. */
    // a soft sky to reflect (white above, pale sea-blue at the horizon, sand below)
    const pmrem = new T.PMREMGenerator(renderer);
    const envScene = new T.Scene();
    const skyGeo = new T.SphereGeometry(50, 32, 16), skyCol = [];
    const cTop = new T.Color("#f4f8fb"), cMid = new T.Color("#7fa3b6"), cLow = new T.Color("#c9b48e");
    for (let i = 0; i < skyGeo.attributes.position.count; i++) {
      const yy = skyGeo.attributes.position.getY(i) / 50;
      const c = yy > 0 ? cMid.clone().lerp(cTop, Math.pow(yy, 0.6)) : cMid.clone().lerp(cLow, Math.min(1, -yy * 2.5));
      skyCol.push(c.r, c.g, c.b);
    }
    skyGeo.setAttribute("color", new T.Float32BufferAttribute(skyCol, 3));
    envScene.add(new T.Mesh(skyGeo, new T.MeshBasicMaterial({ vertexColors: true, side: T.BackSide })));
    const sunDisc = new T.Mesh(new T.SphereGeometry(4, 16, 8), new T.MeshBasicMaterial({ color: 0xfff3dc }));
    sunDisc.position.set(-25, 35, 20); envScene.add(sunDisc);
    const envTex = pmrem.fromScene(envScene, 0.035).texture;

    // facade: bright glass panels between thin vertical steel fins, faint floor lines
    const finTex = (() => {
      const c = document.createElement("canvas"); c.width = 64; c.height = 64;
      const g = c.getContext("2d");
      const grd = g.createLinearGradient(0, 0, 64, 0);
      grd.addColorStop(0, "#7d93a4"); grd.addColorStop(0.5, "#a9bccb"); grd.addColorStop(1, "#71889a");
      g.fillStyle = grd; g.fillRect(0, 0, 64, 64);
      g.fillStyle = "rgba(40,60,75,.18)"; for (let yy = 0; yy < 64; yy += 8) g.fillRect(0, yy, 64, 1);
      g.fillStyle = "#f2f6f9"; for (let xx = 0; xx < 64; xx += 16) g.fillRect(xx, 0, 3, 64);
      g.fillStyle = "#d5dfe6"; for (let xx = 8; xx < 64; xx += 16) g.fillRect(xx, 0, 1, 64);
      const t = new T.CanvasTexture(c); t.wrapS = t.wrapT = T.RepeatWrapping; t.colorSpace = T.SRGBColorSpace; t.anisotropy = 8;
      return t;
    })();
    const FT = 2.2;                                              // one fin tile = 2.2 units
    const scaleUV = (g, su, sv) => { const uv = g.attributes.uv; for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * su, uv.getY(i) * sv); return g; };
    const burjMat = new T.MeshStandardMaterial({ map: finTex, color: 0xffffff, roughness: 0.18, metalness: 0.85,
                                                  envMap: envTex, envMapIntensity: 1.15 });
    const burj = new T.Group(); burj.position.set(bx, 0.35, bz); burj.rotation.y = 0.35;
    const part = (geo, y0) => { const m = new T.Mesh(geo, burjMat); m.position.y = y0; m.castShadow = true; m.receiveShadow = true; burj.add(m); return m; };

    const WINGS = 3, CORE_H = 47;
    // core: one smooth, tapering column
    part(scaleUV(new T.CylinderGeometry(0.62, 1.12, CORE_H, 6).translate(0, CORE_H / 2, 0), 6.0 / FT, CORE_H / FT), 0);
    // three wings, each stepping back four times; the wings end at different heights, so the steps spiral
    const wingH = [24, 30.5, 37];
    for (let w = 0; w < WINGS; w++) {
      const ang = (w / WINGS) * Math.PI * 2, H = wingH[w], S = 4;
      for (let j = 0; j < S; j++) {
        const y0 = (H / S) * j, h = H / S, f = 1 - j / S;
        const L = 0.75 + 2.35 * f, W = 1.1 * (0.6 + 0.4 * f);
        const arm = new T.Group(); arm.rotation.y = ang; arm.position.y = y0; burj.add(arm);
        const box = new T.Mesh(scaleUV(new T.BoxGeometry(L, h, W).translate(L / 2, h / 2, 0), L / FT, h / FT), burjMat);
        const cap = new T.Mesh(scaleUV(new T.CylinderGeometry(W / 2, W / 2, h, 24).translate(L, h / 2, 0), 1.6 * W / FT, h / FT), burjMat);
        [box, cap].forEach(m => { m.castShadow = m.receiveShadow = true; arm.add(m); });
      }
    }
    let y = CORE_H;
    // crown: a slim tapering shaft, then the needle
    part(scaleUV(new T.CylinderGeometry(0.34, 0.6, 7, 6).translate(0, 3.5, 0), 2 / FT, 7 / FT), y); y += 7;
    part(new T.ConeGeometry(0.32, 9, 12).translate(0, 4.5, 0), y); y += 9;
    const beacon = new T.Mesh(new T.SphereGeometry(0.3, 12, 12), new T.MeshBasicMaterial({ color: 0xff4d4d }));
    beacon.position.y = y + 0.2; burj.add(beacon);
    // plaza around the base
    // a slimmer footprint than before (the real tower is very slender), on a plaza the neighbours keep clear of
    const plaza = new T.Mesh(new T.CylinderGeometry(KEEP - 0.3, KEEP - 0.1, 0.35, 40), plotMat); plaza.position.set(bx, 0.17, bz); plaza.receiveShadow = true; scene.add(plaza);
    burj.scale.set(0.46, reduce ? 1 : 0.001, 0.46); scene.add(burj);
    const BURJ_TOP = y + 1;

    /* --- floating labels --- */
    const labelLayer = box.querySelector(".c3-labels");
    const labels = [
      { key: "burj", pos: new T.Vector3(bx, BURJ_TOP + 1.5, bz), big: true },
      ...[["palm", "Palm Jumeirah"], ["marina", "Dubai Marina"]].filter(([, n]) => C[n]).map(([key, n]) => {
        const [x, z] = px(C[n].lat, C[n].lon); return { key, pos: new T.Vector3(x, 2.4 + C[n].ppsf * 0.0165 + 3, z) };
      }),
    ];
    labels.forEach(l => { l.el = document.createElement("span"); l.el.className = "c3-label" + (l.big ? " big" : ""); labelLayer.appendChild(l.el); });

    /* --- Burj Khalifa view: rings on the ground at 5, 10, 20 and 30 km (1 unit = 0.5 km) --- */
    const RING_KM = [5, 10, 20, 30];
    const ringMat = new T.MeshBasicMaterial({ transparent: true, opacity: 0.6, depthWrite: false, side: T.DoubleSide });
    const rings = RING_KM.map(km => {
      const r = km * 2, m = new T.Mesh(new T.RingGeometry(r - 0.22, r + 0.22, 160), ringMat);
      m.rotation.x = -Math.PI / 2; m.position.set(bx, 0.45, bz); m.scale.setScalar(0.001); m.visible = false; scene.add(m);
      const el = document.createElement("span"); el.className = "c3-label ring"; el.style.opacity = 0; labelLayer.appendChild(el);
      return { km, r, m, el, grow: 0 };
    });

    /* --- colours follow the site theme --- */
    const LIGHT_RAMP = ["#e4f4f1", "#b4e3da", "#6cc7b8", "#2fa596", "#13807a"];   // low -> high price
    function applyColors() {
      const d = dark();
      const ramp = d ? [1, 2, 3, 4, 5].map(k => css(`--seq-${k}`)) : LIGHT_RAMP;
      ramp.forEach((c, i) => towerMats[i].color.set(c || LIGHT_RAMP[i]));
      towerMats.forEach(m => {
        m.emissive.set(d ? 0xffc46b : 0x000000); m.emissiveMap = d ? litTex : null; m.emissiveIntensity = d ? 1.25 : 0; m.needsUpdate = true;
      });
      hiMat.color.set(css("--brand")); hiMat.emissive.set(css("--brand")); hiMat.emissiveIntensity = d ? 0.55 : 0.25;
      burjMat.color.set(d ? "#dfe8ee" : "#9fb3c3");
      burjMat.envMapIntensity = d ? 0.35 : 0.7; burjMat.metalness = d ? 0.45 : 0.3; burjMat.roughness = d ? 0.3 : 0.35;
      burjMat.emissive.set(d ? 0x9fd3ff : 0x000000); burjMat.emissiveMap = d ? litTex : null; burjMat.emissiveIntensity = d ? 0.7 : 0; burjMat.needsUpdate = true;
      plotMat.color.set(d ? "#16252c" : "#efe6d4");
      seaMat.color.set(d ? "#0e4452" : "#79c3d6"); seaMat.opacity = d ? 0.55 : 0.4;
      gridMat.color.set(css("--line-strong") || "#cbd4dd"); gridMat.opacity = d ? 0.4 : 0.55;
      hemi.intensity = d ? 0.45 : 1.0; hemi.color.set(d ? 0x8fb4ff : 0xffffff); hemi.groundColor.set(d ? 0x0a1418 : 0xe8dcc4);
      sun.intensity = d ? 0.55 : 1.7; sun.color.set(d ? 0x9fc3ff : 0xfff1dc);
      ground.material.opacity = d ? 0.35 : 0.14;
      ringMat.color.set(css("--brand") || "#0F766E");
      const legend = box.querySelector(".c3-ramp");
      legend.style.background = `linear-gradient(90deg, ${ramp.join(", ")})`;
      requestRender();
    }

    /* --- camera: orbit around a point between the coast and Downtown --- */
    const target = new T.Vector3(...(() => { const [x, z] = px(25.115, 55.25); return [x, 9, z]; })());
    let az = 0.72, el = 0.72, dist = 160, zoom = 1, autoSpin = !reduce;
    function placeCamera() {
      const D = dist * zoom;
      camera.position.set(target.x + D * Math.cos(el) * Math.sin(az), target.y + D * Math.sin(el), target.z + D * Math.cos(el) * Math.cos(az));
      camera.lookAt(target);
    }
    function resize() {
      const w = stage.clientWidth, h = stage.clientHeight; if (!w || !h) return;
      renderer.setSize(w, h, false);
      camera.aspect = w / h; camera.updateProjectionMatrix();
      dist = 165 / Math.min(1.15, Math.max(0.6, camera.aspect * 0.95));
      placeCamera(); requestRender();
    }
    new ResizeObserver(resize).observe(stage);

    /* --- interaction: drag to turn, point for details, click to estimate --- */
    const ray = new T.Raycaster(), ptr = new T.Vector2();
    let hovered = null, drag = null, lastPtr = null;
    const BURJ_ID = "__burj";
    const burjParts = []; burj.traverse(o => { if (o.isMesh) { o.userData.name = BURJ_ID; burjParts.push(o); } });
    const pickables = Object.values(groups).flatMap(g => [...g.userData.meshes, g.children[0]]).concat(burjParts);
    function placeTip(cx, cy) {
      tip.hidden = false;
      const r = box.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
      let lx = cx - r.left + 16, ly = cy - r.top - th - 12;
      if (lx + tw > r.width - 8) lx = cx - r.left - tw - 16;
      if (ly < 8) ly = cy - r.top + 18;
      tip.style.left = Math.max(8, lx) + "px"; tip.style.top = ly + "px";
    }
    function setHover(name, cx, cy) {
      if (name !== hovered) {
        if (hovered && groups[hovered]) groups[hovered].userData.meshes.forEach(m => (m.material = towerMats[groups[hovered].userData.level]));
        hovered = name;
        if (name && groups[name]) groups[name].userData.meshes.forEach(m => (m.material = hiMat));
        box.classList.toggle("hovering", !!name);
      }
      if (!name) { tip.hidden = true; return requestRender(); }
      if (name === BURJ_ID) {                                // Burj Khalifa: invite a click instead of an estimate
        tip.innerHTML = `<b>${tr("burj")}</b><div class="c3-row" style="border:0;padding-top:0"><small>${tr("burjSub")}</small></div>`
          + (touch ? `<button type="button" class="c3-go">${tr("burjTipTouch")} →</button>` : `<div class="c3-cta">${tr("burjTip")} →</div>`);
        placeTip(cx, cy);
        const go = tip.querySelector(".c3-go"); if (go) go.onclick = () => { setHover(null); openBurj(); };
        return requestRender();
      }
      const c = C[name], m2 = isM2();
      const per = moneyShort(c.ppsf * (m2 ? 10.7639 : 1), 2);
      const yoy = c.yoy == null ? "" : `<span class="${c.yoy >= 0 ? "up" : "down"}">${c.yoy >= 0 ? "▲" : "▼"} ${Math.abs(c.yoy).toFixed(1)}%</span>`;
      tip.innerHTML = `<b>${name}</b><div class="c3-fig">${per} <small>${m2 ? tr("perM2") : tr("per")}</small></div>`
        + (yoy ? `<div class="c3-row"><small>${tr("yoy")}</small>${yoy}</div>` : "")
        + (touch ? `<button type="button" class="c3-go">${tr("goTouch")} →</button>` : `<div class="c3-cta">${tr("go")} →</div>`);
      placeTip(cx, cy);
      const go = tip.querySelector(".c3-go"); if (go) go.onclick = () => estimateHere(name);
      requestRender();
    }
    function pick(cx, cy) {
      const r = renderer.domElement.getBoundingClientRect();
      ptr.set(((cx - r.left) / r.width) * 2 - 1, -((cy - r.top) / r.height) * 2 + 1);
      ray.setFromCamera(ptr, camera);
      const hit = ray.intersectObjects(pickables, false)[0];
      return hit ? hit.object.userData.name : null;
    }
    const cvs = renderer.domElement;
    cvs.addEventListener("pointerdown", e => { drag = { x: e.clientX, y: e.clientY, az, el, moved: false }; if (e.pointerType !== "touch") cvs.setPointerCapture(e.pointerId); });
    cvs.addEventListener("pointermove", e => {
      lastPtr = [e.clientX, e.clientY];
      if (drag) {
        const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
        if (Math.abs(dx) + Math.abs(dy) > 4) { drag.moved = true; autoSpin = false; flight = null; if (hovered) setHover(null); }
        if (drag.moved) {
          az = drag.az - dx * 0.006; el = Math.min(1.15, Math.max(0.28, drag.el + dy * 0.004));
          placeCamera(); requestRender();
        }
        return;
      }
      if (e.pointerType === "mouse") setHover(pick(e.clientX, e.clientY), e.clientX, e.clientY);
    });
    cvs.addEventListener("pointerup", e => {
      const d = drag; drag = null;
      if (d && d.moved) { setTimeout(() => (autoSpin = !reduce), 2500); return; }
      const name = pick(e.clientX, e.clientY);
      if (e.pointerType === "mouse") {
        if (name === BURJ_ID) { setHover(null); burjOpen ? closeBurj() : openBurj(); }
        else if (name) estimateHere(name);
        return;
      }
      setHover(name, e.clientX, e.clientY);                  // touch: first tap shows the card with a button
    });
    cvs.addEventListener("pointercancel", () => { drag = null; });
    cvs.addEventListener("pointerleave", e => { if (!drag && e.pointerType === "mouse") setHover(null); });

    /* --- Burj Khalifa view ---
       Click the tower: the camera flies in close, then rises over the city while rings at 5, 10, 20
       and 30 km grow out from the tower, and a panel shows the typical price per sq ft in each band
       (from the sales data, OPT.burj_bands). "Back to the city", × or Esc flies back. */
    const BANDS = OPT.burj_bands || [];
    const panel = box.querySelector(".c3-burj");
    const TAU = Math.PI * 2;
    let burjOpen = false, flight = null, saved = null, ringT0 = 0, ringDir = 0, panelTimer = 0;
    const state = () => ({ tx: target.x, ty: target.y, tz: target.z, az, el, zoom });
    const apply = s => { target.set(s.tx, s.ty, s.tz); az = s.az; el = s.el; zoom = s.zoom; placeCamera(); };
    const fillIn = (s, o) => s.replace(/\{(\w+)\}/g, (_, k) => o[k]);
    const num = n => new Intl.NumberFormat(locale()).format(n);

    function renderPanel() {
      const m2 = isM2(), k = m2 ? 10.7639 : 1, u = m2 ? tr("m2") : tr("sqft");
      const max = Math.max(...BANDS.map(b => b.ppsf));
      const near = BANDS[0], far = BANDS.find(b => b.from === 20) || BANDS[BANDS.length - 1];
      const shown = panel.classList.contains("show");
      panel.setAttribute("aria-label", `${tr("burj")}: ${tr("burjKicker")}`);
      panel.innerHTML = `<button type="button" class="x" aria-label="${tr("burjBack")}">×</button>
        <span class="kick">${tr("burjKicker")}</span><h3>${tr("burj")}</h3><p class="sub">${tr("burjSub")}</p>
        <p class="head">${fillIn(tr("burjHead"), { x: `<b>${num(+(near.ppsf / far.ppsf).toFixed(1))}</b>`, u })}</p>
        <div class="cols"><span>${tr("burjCol")}</span><span>${fillIn(tr("burjColPrice"), { u })}</span></div>
        <ol>${BANDS.map((b, i) => `<li style="transition-delay:${120 + i * 90}ms">
          <span class="d">${b.to == null ? fillIn(tr("bandEnd"), { a: num(b.from) }) : fillIn(tr("band"), { a: num(b.from), b: num(b.to) })}</span>
          <span class="bar"><i style="width:${shown ? (b.ppsf / max * 100).toFixed(1) : 0}%" data-w="${(b.ppsf / max * 100).toFixed(1)}"></i></span>
          <span class="v">${money(b.ppsf * k)}<small>${fillIn(tr("sales"), { n: num(b.sales) })}</small></span></li>`).join("")}</ol>
        <p class="note">${tr("burjNote")}</p>
        <button type="button" class="btn ghost c3-back">${tr("burjBack")}</button>`;
      panel.querySelector(".x").onclick = closeBurj;
      panel.querySelector(".c3-back").onclick = closeBurj;
      if (shown) box.style.setProperty("--burj-h", panel.offsetHeight + 24 + "px");
    }
    function showPanel() {
      if (!burjOpen) return;
      panel.hidden = false;
      box.style.setProperty("--burj-h", panel.offsetHeight + 24 + "px");   // small screens: make room below the city
      requestAnimationFrame(() => {
        panel.classList.add("show");
        panel.querySelectorAll(".bar i").forEach(i => (i.style.width = i.dataset.w + "%"));
      });
    }
    function openBurj() {
      if (burjOpen || !BANDS.length) return;
      burjOpen = true; autoSpin = false;
      saved = state();
      box.classList.add("burj-mode");
      renderPanel(); panel.classList.remove("show");
      const a = az;
      const close = { tx: bx, ty: 16, tz: bz, az: a + 0.55, el: 0.26, zoom: 0.34 };    // swoop in to the tower
      const hold = { ...close, az: a + 0.8, ty: 22 };                                   // a slow look up
      const top = { tx: bx, ty: 0, tz: bz, az: a + 1.05, el: 0.98, zoom: 1.3 };         // rise above the rings
      if (reduce) { apply(top); ringT0 = performance.now() - 5000; }
      else {
        flight = { t0: performance.now(), keys: [[0, state()], [1500, close], [2200, hold], [3800, top]], done: () => (autoSpin = burjOpen) };
        ringT0 = performance.now() + 2300;
      }
      ringDir = 1;
      clearTimeout(panelTimer); panelTimer = setTimeout(showPanel, reduce ? 0 : 2600);
      requestRender();
    }
    function closeBurj() {
      if (!burjOpen) return;
      burjOpen = false; clearTimeout(panelTimer);
      panel.classList.remove("show");
      setTimeout(() => { if (!burjOpen) { panel.hidden = true; box.style.removeProperty("--burj-h"); } }, 350);
      box.classList.remove("burj-mode");
      ringT0 = performance.now(); ringDir = -1;
      const back = { ...saved };
      let d = (back.az - az) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU;
      back.az = az + d;                                     // turn back the short way round
      if (reduce) { apply(back); autoSpin = false; }
      else flight = { t0: performance.now(), keys: [[0, state()], [1400, back]], done: () => (autoSpin = !burjOpen) };
      requestRender();
    }
    document.addEventListener("keydown", e => { if (e.key === "Escape" && burjOpen) closeBurj(); });
    document.addEventListener("dxb:currency", () => { if (burjOpen) renderPanel(); });
    const lerp = (a, b, k) => a + (b - a) * k;
    const easeIO = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
    function stepFlight(now) {                              // returns true while the camera is moving
      if (!flight) return false;
      const t = now - flight.t0, K = flight.keys;
      let i = 0; while (i < K.length - 2 && t > K[i + 1][0]) i++;
      const [ta, A] = K[i], [tb, B] = K[i + 1], k = easeIO(Math.min(1, Math.max(0, (t - ta) / (tb - ta))));
      apply({ tx: lerp(A.tx, B.tx, k), ty: lerp(A.ty, B.ty, k), tz: lerp(A.tz, B.tz, k),
              az: lerp(A.az, B.az, k), el: lerp(A.el, B.el, k), zoom: lerp(A.zoom, B.zoom, k) });
      if (t >= K[K.length - 1][0]) { const done = flight.done; flight = null; if (done) done(); }
      return true;
    }
    function stepRings(now) {                               // rings grow one after the other, or shrink together
      if (!ringDir) return false;
      const t = now - ringT0; let busy = false;
      rings.forEach((g, i) => {
        if (ringDir > 0) { const k = Math.min(1, Math.max(0, (t - i * 260) / 900)); g.grow = ease(k); if (k < 1) busy = true; }
        else { const k = Math.max(0, 1 - t / 450); g.grow = Math.min(g.grow, k); if (k > 0) busy = true; }
        g.m.visible = g.grow > 0.002; g.m.scale.setScalar(Math.max(0.001, g.grow));
      });
      if (!busy && ringDir < 0) ringDir = 0;
      return busy;
    }
    const ringPos = new T.Vector3();
    function placeRingLabels(r) {                           // labels sit on the rings, to one side of the tower as seen by the camera
      let ux = camera.position.x - bx, uz = camera.position.z - bz; const len = Math.hypot(ux, uz) || 1; ux /= len; uz /= len;
      const a = 0.75, cx = Math.cos(a) * ux - Math.sin(a) * uz, cz = Math.sin(a) * ux + Math.cos(a) * uz;
      rings.forEach(g => {
        if (g.grow < 0.05) { g.el.style.opacity = 0; return; }
        ringPos.set(bx + cx * g.r * g.grow, 0.6, bz + cz * g.r * g.grow).project(camera);
        const on = ringPos.z < 1 && Math.abs(ringPos.x) < 0.92 && Math.abs(ringPos.y) < 0.92;
        g.el.style.opacity = on ? Math.min(1, g.grow * 1.4) : 0;
        g.el.style.transform = `translate(${((ringPos.x + 1) / 2 * r.width).toFixed(1)}px, ${((1 - ringPos.y) / 2 * r.height).toFixed(1)}px) translate(-50%, -50%)`;
        const txt = fillIn(tr("km"), { a: num(g.km) }); if (g.el.textContent !== txt) g.el.textContent = txt;
      });
    }

    /* --- render loop: only while the city is on screen --- */
    let visible = true, needs = true, raf = 0, t0 = performance.now(), last = t0;
    function requestRender() { needs = true; if (!raf && visible && !document.hidden) raf = requestAnimationFrame(frame); }
    new IntersectionObserver(es => { visible = es[0].isIntersecting; if (visible) requestRender(); }).observe(box);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) requestRender(); });
    const ease = t => 1 - Math.pow(1 - t, 3);
    const v3 = new T.Vector3();
    function frame(now) {
      raf = 0;
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      let animating = false;
      if (!reduce) {
        const el2 = now - t0;
        growers.forEach(g => {
          const k = Math.min(1, Math.max(0, (el2 - g.delay) / 900));
          g.m.scale.y = Math.max(0.001, ease(k)); if (k < 1) animating = true;
        });
        const kb = Math.min(1, el2 / 1600); burj.scale.y = Math.max(0.001, ease(kb)); if (kb < 1) animating = true;
        if (stepFlight(now)) animating = true;
        else if (autoSpin && !hovered) { az += dt * (burjOpen ? 0.03 : 0.045); placeCamera(); animating = true; }
        beacon.visible = dark() ? Math.floor(now / 700) % 2 === 0 : true;
        if (dark()) animating = true;
      }
      if (stepRings(now)) animating = true;
      renderer.render(scene, camera);
      // labels
      const r = stage.getBoundingClientRect();
      labels.forEach(l => {
        v3.copy(l.pos).project(camera);
        const on = v3.z < 1 && Math.abs(v3.x) < 0.95 && Math.abs(v3.y) < 0.95;
        l.el.style.opacity = on ? 1 : 0;
        l.el.style.transform = `translate(${((v3.x + 1) / 2 * r.width).toFixed(1)}px, ${((1 - v3.y) / 2 * r.height).toFixed(1)}px) translate(-50%, -100%)`;
        const txt = tr(l.key); if (l.el.textContent !== txt) l.el.textContent = txt;
      });
      placeRingLabels(r);
      if (!box.classList.contains("ready")) box.classList.add("ready");
      needs = false;
      if ((animating || needs) && visible && !document.hidden) raf = requestAnimationFrame(frame);
    }
    if (reduce) growers.forEach(g => (g.m.scale.y = 1));

    new MutationObserver(() => { applyColors(); texts(); if (burjOpen) renderPanel(); }).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme", "lang", "dir"] });
    // the unit switch (sq ft / m²) changes the legend and the Burj Khalifa panel
    document.addEventListener("click", e => { if (e.target.closest("[data-unit]")) setTimeout(() => { texts(); if (burjOpen) renderPanel(); }, 50); });
    box.view = (a, e, d, tx, ty, tz) => { az = a; el = e; autoSpin = false; if (tx != null) target.set(tx, ty, tz); placeCamera(); if (d) { camera.position.sub(target).setLength(d).add(target); camera.lookAt(target); } requestRender(); };
    box.burjAt = [bx, bz];
    box.burjView = { open: openBurj, close: closeBurj,
                     screen: () => { const r = stage.getBoundingClientRect(), p = new T.Vector3(bx, 22, bz).project(camera);
                                     return [r.left + (p.x + 1) / 2 * r.width, r.top + (1 - p.y) / 2 * r.height]; } };
    applyColors(); placeCamera(); resize(); requestRender();
  }
})();
</script>
</body>
</html>
