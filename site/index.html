  .rp-doc dt { color: #5B6774; text-align: end; } .rp-doc dd { margin: 0; font-weight: 600; text-align: end; font-variant-numeric: tabular-nums; }
  .rp-title { margin-bottom: 14pt; }
  .rp-title h1 { font-size: 18pt; line-height: 1.25; font-weight: 700; letter-spacing: -.01em; margin: 0 0 2pt; max-width: none; }
  [dir="rtl"] .rp-title h1 { letter-spacing: 0; }
  .rp-title p { margin: 0; color: #5B6774; font-size: 9.5pt; }
  .rp-grid { display: grid; grid-template-columns: 1.08fr 1fr; gap: 12pt; margin-bottom: 20pt; }
  .rp-h { font-size: 8pt; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #5B6774; margin: 0 0 8pt; }
  [dir="rtl"] .rp-h { letter-spacing: 0; }
  .rp-value { padding: 12pt 14pt; border-radius: 6pt; background: #EFF7F5; border: 1px solid #CDE6E1; }
  .rp-label { display: block; font-size: 8.5pt; color: #3E5A57; }
  .rp-big { display: block; font-size: 25pt; line-height: 1.15; font-weight: 700; letter-spacing: -.02em; color: #0B4F4A; margin: 2pt 0 10pt;
            font-variant-numeric: tabular-nums; }
  .rp-bar { position: relative; height: 5pt; border-radius: 3pt; background: #D3E9E4; }
  .rp-bar i { position: absolute; inset: 0 8%; border-radius: 3pt; background: linear-gradient(90deg, #8FD3C8, #0F766E, #8FD3C8); }
  .rp-bar em { position: absolute; left: 50%; top: -3pt; width: 2pt; height: 11pt; margin-left: -1pt; background: #0B4F4A; border-radius: 1pt; }
  .rp-bar-ends { display: flex; justify-content: space-between; font-size: 8pt; color: #3E5A57; margin: 4pt 0 10pt; font-variant-numeric: tabular-nums; }
  .rp-bar-ends span:nth-child(2) { color: #5B6774; }
  .rp-kv { margin: 0; }
  .rp-kv div { display: flex; justify-content: space-between; align-items: baseline; gap: 10pt; padding: 4.5pt 0; border-top: 1px solid #E3E8EE; }
  .rp-value .rp-kv div { border-top-color: #CDE6E1; }
  .rp-kv dt { color: #5B6774; flex: none; }
  .rp-kv dd { margin: 0; font-weight: 600; text-align: end; font-variant-numeric: tabular-nums; }
  .rp-kv dd small { display: block; font-weight: 400; font-size: 7.5pt; color: #5B6774; }
  .rp-conf { display: inline-block; padding: 0 6pt; border-radius: 8pt; font-size: 8pt; font-weight: 700; }
  .rp-conf.rpHigh { background: #D7F0E2; color: #116035; } .rp-conf.rpMed { background: #FCEFD3; color: #8A5A00; } .rp-conf.rpLow { background: #FBE0DC; color: #9B2C1F; }
  .rp-subject { padding: 12pt 2pt 0; }
  .rp-subject .rp-kv div:first-child { border-top: 0; }
  .rp-sec { display: flex; align-items: center; gap: 7pt; font-size: 12pt; font-weight: 700; margin: 0 0 4pt; }
  .rp-sec span { display: inline-grid; place-items: center; width: 16pt; height: 16pt; border-radius: 4pt; background: #0F766E; color: #fff; font-size: 8.5pt; }
  .rp-lede { margin: 0 0 9pt; color: #5B6774; }
  .rp-table { width: 100%; border-collapse: collapse; font-size: 8.8pt; }
  .rp-table th { text-align: start; font-size: 7.5pt; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #5B6774;
                 background: #F2F5F7; padding: 5pt 6pt; border: 0; }
  [dir="rtl"] .rp-table th { letter-spacing: 0; }
  .rp-table td { padding: 5.5pt 6pt; border-bottom: 1px solid #E3E8EE; font-variant-numeric: tabular-nums; }
  .rp-table .num { text-align: end; }
  .rp-table tr.rp-subj td { background: #EFF7F5; color: #0B4F4A; font-weight: 700; border-bottom: 2px solid #0F766E; }
  .rp-note { margin: 7pt 0 0; font-size: 8.5pt; color: #3E4A56; }
  .rp-kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9pt; margin: 8pt 0 10pt; }
  .rp-kpis div { padding: 9pt 11pt; border: 1px solid #E3E8EE; border-radius: 6pt; }
  .rp-kpis span { display: block; font-size: 8pt; color: #5B6774; }
  .rp-kpis b { display: block; font-size: 15pt; font-weight: 700; margin-top: 2pt; font-variant-numeric: tabular-nums; }
  .rp-kpis b.up { color: #15803D; } .rp-kpis b.down { color: #B42318; }
  .rp-chart-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10pt; margin-top: 4pt; }
  .rp-chart-head b { font-size: 9pt; }
  .rp .pr-legend i { border-top-color: #0F766E; }
  .rp .pr-chart { margin: 4pt 0 18pt; }
  .rp-body { margin: 0 0 14pt; color: #3E4A56; text-align: justify; }
  .rp-notice { padding: 10pt 12pt; border-radius: 6pt; background: #F6F7F9; border-inline-start: 3pt solid #9AA6B2; margin-bottom: 12pt; }
  .rp-notice h2 { font-size: 9pt; font-weight: 700; margin: 0 0 3pt; }
  .rp-notice p { margin: 0; font-size: 8.5pt; color: #3E4A56; }
  .rp-sign { margin: 0; font-size: 8pt; color: #5B6774; }
  .rp-foot { margin-top: auto; display: flex; justify-content: space-between; gap: 12pt;
             padding-top: 6pt; border-top: 1px solid #E3E8EE; font-size: 7.5pt; color: #5B6774; }

  /* ---------- Touch screens: 44px targets (Apple HIG / WCAG 2.5.5) ---------- */
  @media (pointer: coarse) {
    .tool { height: 44px; } .tool.square { width: 44px; }
    .seg button, .seg button + button { min-height: 40px; }
    .hm-head .seg button { padding: 6px var(--s3); }
    .mt-chip { height: 40px; } .mt-zoom button { width: 44px; height: 44px; }
    .quick button { min-height: 40px; }
    .combo-list li, .cur-list li { min-height: 44px; align-items: center; }
  }
  @media (max-width: 560px) {
    .tool { padding: 0 10px; }
  }
</style>
</head>

<main data-page="estimate" id="estimatePage">
  <form id="form" class="card" novalidate>

    <!-- Two short steps instead of one long form -->
    <div class="steps">
      <button type="button" class="step active" data-go="1">
        <span class="num">1</span><span><b data-i18n="step1"></b><small data-i18n="step1Sub"></small></span>
      </button>
      <div class="step-line"><i id="progress"></i></div>
      <button type="button" class="step" data-go="2">
        <span class="num">2</span><span><b data-i18n="step2"></b><small data-i18n="step2Sub"></small></span>
      </button>
    </div>

    <!-- Step 1: where and what -->
    <div class="panel" id="p1">
      <div class="section">
        <h2 class="section-title">
          <span class="badge"><svg class="icon"><use href="#i-pin"/></svg></span>
          <span data-i18n="location"></span>
        </h2>
        <label for="communitySearch" data-i18n="community"></label>
        <div class="combo">
          <svg class="icon sm ci"><use href="#i-search"/></svg>
          <input id="communitySearch" type="text" autocomplete="off" spellcheck="false"
                 role="combobox" aria-expanded="false" aria-controls="communityList">
          <input id="community" type="hidden">
          <svg class="icon sm cc"><use href="#i-chev"/></svg>
          <ul id="communityList" class="combo-list hidden" role="listbox"></ul>
        </div>
        <div class="quick" id="quick"><span class="quick-label" data-i18n="popular"></span></div>
        <div class="chip" id="loc"></div>
      </div>

      <div class="section">
        <h2 class="section-title">
          <span class="badge"><svg class="icon"><use href="#i-home"/></svg></span>
          <span data-i18n="basics"></span>
        </h2>
        <div class="grid">
          <div class="full">
            <span class="label-like" id="kindLabel" data-i18n="kindLabel"></span>
            <div class="seg wide kind" id="kindSeg" role="group" aria-labelledby="kindLabel"></div>
            <p class="kind-note hidden" id="kindNote"></p>
          </div>
          <div>
            <label for="property_type" data-i18n="type"></label>
            <select id="property_type"></select>
          </div>
          <div>
            <div class="label-row">
              <label for="area" data-i18n="area"></label>
              <div class="seg" role="group">
                <button type="button" data-unit="sqft" data-i18n="unitSqft"></button>
                <button type="button" data-unit="m2" data-i18n="unitM2"></button>
              </div>
            </div>
            <input id="area" type="number" min="1" step="1" aria-describedby="area-error">
            <p class="field-error hidden" id="area-error" role="alert"></p>
          </div>
        </div>
      </div>

      <button id="next" class="btn" type="button">
        <span data-i18n="next"></span><svg class="icon flip"><use href="#i-arrow"/></svg>
      </button>
    </div>

    <!-- Step 2: details that fine-tune the estimate -->
    <div class="panel hidden" id="p2">
      <div class="section">
        <h2 class="section-title">
          <span class="badge"><svg class="icon"><use href="#i-ruler"/></svg></span>
          <span data-i18n="details"></span>
        </h2>
        <div class="grid">
          <div class="apt">
            <label for="floor" data-i18n="floor"></label>
            <input id="floor" type="number" min="1" max="80" value="10" aria-describedby="floor-error">
            <p class="field-error hidden" id="floor-error" role="alert"></p>
          </div>
          <div>
            <label for="year_built" data-i18n="yearBuilt"></label>
            <input id="year_built" type="number" min="2008" max="2023" value="2018" aria-describedby="year_built-error">
            <p class="field-error hidden" id="year_built-error" role="alert"></p>
          </div>
          <div>
            <label for="parking_spaces" data-i18n="parking"></label>
            <select id="parking_spaces"><option>1</option><option selected>2</option><option>3</option><option>4</option></select>
          </div>
          <div>
            <label for="view" data-i18n="view"></label>
            <select id="view"></select>
          </div>
          <div>
            <label for="furnishing" data-i18n="furnishing"></label>
            <select id="furnishing"></select>
          </div>
          <div>
            <label for="condition" data-i18n="condition"></label>
            <select id="condition"></select>
          </div>
          <div class="full">
            <label class="ios-checkbox">
              <input id="chiller_included" type="checkbox" checked>
              <div class="checkbox-wrapper">
                <div class="checkbox-bg"></div>
                <svg class="checkbox-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path class="check-path" d="M4 12L10 18L20 6" stroke="currentColor" stroke-width="3"
                        stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
              </div>
              <span data-i18n="chiller"></span>
            </label>
          </div>
        </div>
      </div>

      <div class="actions">
        <button id="back" class="btn ghost" type="button">
          <svg class="icon flip back"><use href="#i-arrow"/></svg><span data-i18n="back"></span>
        </button>
        <button id="go" class="btn" type="submit">
          <span data-i18n="estimate"></span><span class="spin" aria-hidden="true"></span><svg class="icon flip" aria-hidden="true"><use href="#i-arrow"/></svg>
        </button>
      </div>
    </div>
    <p class="form-note"><svg class="icon sm"><use href="#i-calendar"/></svg><span id="dataNote"></span></p>
  </form>

  <div class="side">
    <section class="card sticky" id="result" aria-live="polite"></section>
  </div>
</main>

<!-- Property report: appears after the first estimate -->
<section class="wrap hidden" id="report" data-page="estimate" aria-labelledby="reportTitle">
  <div class="sec-head">
    <h2 id="reportTitle" data-i18n="reportTitle"></h2>
    <p id="reportSub"></p>
  </div>
  <div class="kpi-row" id="kpiRow"></div>
  <div class="report-grid">
    <div class="card">
      <h3 class="card-title"><span class="badge"><svg class="icon" aria-hidden="true"><use href="#i-spark"/></svg></span><span data-i18n="whatifTitle"></span></h3>
      <p class="card-sub" data-i18n="whatifSub"></p>
      <ul class="wi-list" id="whatif"></ul>
    </div>
    <div class="card" id="trendCard">
      <h3 class="card-title"><span class="badge"><svg class="icon" aria-hidden="true"><use href="#i-trend"/></svg></span><span id="trendTitle"></span></h3>
      <p class="card-sub" id="trendSub"></p>

/* ---------------- Validation: errors appear under the field ---------------- */

function validate(n) {

  const check = (id, msg) => { if (!fieldError(id, msg) && !firstBad) firstBad = id; };
  if (n === 1) {
    const sq = areaSqft(), lo = 200, hi = 15000;
    const [a, b] = unit === "m2" ? [Math.round(lo / SQFT_PER_M2), Math.round(hi / SQFT_PER_M2)] : [lo, hi];
    check("area", sq >= lo && sq <= hi ? "" : t("errArea", { a, b, u: t(unit === "m2" ? "unitM2" : "unitSqft") }));
  } else {
    const y = +$("year_built").value;

    const villa = $("property_type").value.endsWith("_villa"), f = +$("floor").value;
    check("floor", villa || (f >= 1 && f <= 80) ? "" : t("errFloor"));

/* Light/dark: the new theme spreads out in a circle from the button (View Transitions).
   Browsers without it, or with reduced motion, get a short colour fade instead. */
$("themeBtn").onclick = () => {
  const swap = () => { theme = theme === "dark" ? "light" : "dark"; store.set("theme", theme); applyTheme(); };
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!document.startViewTransition || still) {
    document.documentElement.classList.add("theme-fade");
    swap();
    setTimeout(() => document.documentElement.classList.remove("theme-fade"), 450);
    return;
  }
  const r = $("themeBtn").getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
  const end = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
  const vt = document.startViewTransition(swap);
  vt.ready.then(() => document.documentElement.animate(
    { clipPath: [`circle(0px at ${x}px ${y}px)`, `circle(${end}px at ${x}px ${y}px)`] },
    { duration: 600, easing: "cubic-bezier(.22, 1, .36, 1)", pseudoElement: "::view-transition-new(root)" }));
};

      .formatToParts(0).find(p => p.type === "currency");

}

/* ---------------- Prediction ---------------- */
$("form").addEventListener("submit", async e => {
  e.preventDefault();
  if (step === 1) return validate(1) && goStep(2);  // Enter on step 1 = Next
  if (!validate(1)) return goStep(1);
  if (!validate(2)) return;
  const ids = ["community", "property_type", "floor", "year_built",
               "parking_spaces", "view", "furnishing", "condition"];
  const body = Object.fromEntries(ids.map(id => [id, $(id).value]));
  body.area_sqft = Math.round(areaSqft());                // the model always works in sq ft
  body.listing_month = OPT.latest_month;                  // latest market data (see note under the form)
  body.chiller_included = $("chiller_included").checked;

  const btn = $("go");
  btn.disabled = true;
  btn.classList.add("loading");
  btn.firstElementChild.textContent = t("estimating");
  $("result").setAttribute("aria-busy", "true");
  $("result").innerHTML = skelResult();
  if (!$("report").classList.contains("hidden")) skelReport();
  try {
    const r = await atLeast(fetch("/api/predict", { method: "POST", headers: { "Content-Type": "application/json" },
                                                    body: JSON.stringify(body) }));
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    last = { ...d, community: body.community, form: body };
    showResult(last);
    if (window.innerWidth < 900) $("result").scrollIntoView({ behavior: "smooth", block: "start" });
  } catch (err) {
    $("result").innerHTML = `<p class="error">${t("error")}${err.message}</p>`;
  } finally {
    btn.disabled = false;
    btn.classList.remove("loading");
    btn.firstElementChild.textContent = t("estimate");
    $("result").setAttribute("aria-busy", "false");
  }
});

/* "Lower price ... Higher price" bar: the typical band for this type in the area (light green),

function rangeBar(d) {
  const lo = d.range_10[0], hi = d.range_10[1], sim = d.similar;
  const a = Math.min(lo, sim ? sim.low : lo) * 0.94, b = Math.max(hi, sim ? sim.high : hi) * 1.04;
  const at = v => ((v - a) / (b - a) * 100).toFixed(2) + "%";
  const span = (x, y) => `inset-inline-start:${at(x)};width:calc(${at(y)} - ${at(x)})`;
  return `<div class="rbar" role="img" aria-label="${t("range")}: ${money(lo)} – ${money(hi)}">
      <div class="rbar-ends"><span>${t("lowerPrice")}</span><span>${t("higherPrice")}</span></div>
      <div class="rbar-track">
        ${sim ? `<i class="typ" style="${span(sim.low, sim.high)}"></i>` : ""}
        <i class="lik" style="${span(lo, hi)}"></i>
        <b class="mark" style="inset-inline-start:${at(d.price_usd)}"></b>
      </div>
      <div class="rbar-val">${money(lo)} – ${money(hi)}</div>
      <div class="rbar-key"><span><i class="lik"></i>${t("range")}</span>${sim ? `<span><i class="typ"></i>${t("typicalHere")}</span>` : ""}</div>
    </div>`;
}

/* Small trend line for the KPI cards (no axes; the card's figures carry the numbers) */
function spark(vals) {
  const v = vals.map((x, i) => [i, x]).filter(p => p[1] != null), W = 96, H = 36;
  const lo = Math.min(...v.map(p => p[1])), hi = Math.max(...v.map(p => p[1])), n = vals.length - 1;
  const pts = v.map(([i, x]) => [(i / n) * (W - 4) + 2, H - 4 - ((x - lo) / (hi - lo || 1)) * (H - 8)]);
  const end = pts[pts.length - 1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true"><path d="M${pts.map(p => p.map(n => n.toFixed(1)).join(",")).join("L")}"
    fill="none" stroke="var(--brand)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${end[0].toFixed(1)}" cy="${end[1].toFixed(1)}" r="2.5" fill="var(--brand)"/></svg>`;
}
/* Line chart (SVG): the community vs the Dubai average, with a hover crosshair and tooltip */
function drawTrend(tr, name, box = $("chart"), fixedW = 0) {
  const W = fixedW || Math.max(300, box.clientWidth), H = 240, m = { t: 12, r: 12, b: 28, l: 64 };
  const n = tr.quarters.length;
  const cv = tr.community.map(v => (v == null ? null : perUnit(v) * (RATES.rates[currency] ?? 1)));
  const dv = tr.dubai.map(v => perUnit(v) * (RATES.rates[currency] ?? 1));
  const all = [...cv.filter(v => v != null), ...dv];
  const avg = cv.filter(v => v != null).reduce((a, b) => a + b, 0) / cv.filter(v => v != null).length;
  let lo = Math.min(...all), hi = Math.max(...all);
  const step = niceStep((hi - lo) / 4);
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const x = i => m.l + (i / (n - 1)) * (W - m.l - m.r);
  const y = v => m.t + (1 - (v - lo) / (hi - lo)) * (H - m.t - m.b);
  const path = vals => {
    let dStr = "", pen = false;
    vals.forEach((v, i) => { if (v == null) { pen = false; return; } dStr += `${pen ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`; pen = true; });
    return dStr;
  };
  const fmt = new Intl.NumberFormat(locale(), { style: "currency", currency, notation: "compact", maximumFractionDigits: 1 });
  let grid = "";
  for (let v = lo; v <= hi + step / 2; v += step) {
    grid += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/>
             <text x="${m.l - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmt.format(v)}</text>`;
  }
  let xl = "";
  tr.quarters.forEach((q, i) => { if (q.endsWith("Q1")) xl += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--muted)">${q.slice(0, 4)}</text>`; });

  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t("trendTitle", { u: unitWord(), c: name })}">
      ${grid}${xl}
      <line x1="${m.l}" x2="${W - m.r}" y1="${y(avg)}" y2="${y(avg)}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="2 3"/>
      <text x="${m.l + 4}" y="${y(avg) - 6}" font-size="11" fill="var(--muted)">${t("average")}</text>
      <path d="${path(dv)}" fill="none" stroke="var(--ref)" stroke-width="1.5" stroke-dasharray="6 5" stroke-linecap="round"/>
      <path d="${path(cv)}" fill="none" stroke="var(--brand)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <g id="hover" style="display:none">
        <line id="hx" y1="${m.t}" y2="${H - m.b}" stroke="var(--text)" stroke-width="1"/>
        <circle id="hd" r="4" fill="var(--ref)" stroke="var(--surface)" stroke-width="2"/>
        <circle id="hc" r="4" fill="var(--brand)" stroke="var(--surface)" stroke-width="2"/>
      </g>
      <rect x="${m.l}" y="0" width="${W - m.l - m.r}" height="${H}" fill="transparent" id="hit"/>
    </svg><div class="tip" style="display:none"></div>`;

  const svg = box.querySelector("svg"), tip = box.querySelector(".tip"), g = svg.querySelector("#hover");
  const show = e => {
    const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) * (W / r.width);
    const i = Math.max(0, Math.min(n - 1, Math.round(((px - m.l) / (W - m.l - m.r)) * (n - 1))));
    g.style.display = "";
    svg.querySelector("#hx").setAttribute("x1", x(i)); svg.querySelector("#hx").setAttribute("x2", x(i));
    svg.querySelector("#hd").setAttribute("cx", x(i)); svg.querySelector("#hd").setAttribute("cy", y(dv[i]));
    const hc = svg.querySelector("#hc");
    if (cv[i] == null) hc.style.display = "none"; else { hc.style.display = ""; hc.setAttribute("cx", x(i)); hc.setAttribute("cy", y(cv[i])); }
    const money0 = v => new Intl.NumberFormat(locale(), { style: "currency", currency, maximumFractionDigits: 0 }).format(v);
    tip.innerHTML = `<b>${quarterText(tr.quarters[i])}</b>
      <div class="row"><svg width="14" height="4"><line x1="0" x2="14" y1="2" y2="2" stroke="var(--brand)" stroke-width="2"/></svg>${name}<strong>${cv[i] == null ? "—" : money0(cv[i])}</strong></div>
      <div class="row"><svg width="14" height="4"><line x1="0" x2="14" y1="2" y2="2" stroke="var(--ref)" stroke-width="2" stroke-dasharray="4 3"/></svg>${t("dubaiAvg")}<strong>${money0(dv[i])}</strong></div>`;
    tip.style.display = "";
    const left = (x(i) / W) * r.width;
    tip.style.left = Math.min(Math.max(left, 90), r.width - 90) + "px";
    tip.style.top = ((Math.min(y(dv[i]), cv[i] == null ? H : y(cv[i])) / H) * r.height) + "px";
  };
  const hide = () => { g.style.display = "none"; tip.style.display = "none"; };
  const hit = svg.querySelector("#hit");
  hit.addEventListener("pointermove", show);
  hit.addEventListener("pointerdown", show);
  hit.addEventListener("pointerleave", hide);
}
function niceStep(raw) {
  const p = Math.pow(10, Math.floor(Math.log10(raw || 1))), f = raw / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
}

async function downloadPDF() {

      if (i) pdf.addPage();

  /* ---- Google Maps: one overlay holds all the HTML labels ---- */

      disableDefaultUI: true, clickableIcons: false, keyboardShortcuts: true,

    const l = new google.maps.Polyline({ path: path.map(([a, b]) => ({ lat: a, lng: b })), strokeColor: color, strokeWeight: weight,

  addRing(km, color) {

  // how far to move the view so the open card does not cover the community: beside it on wide maps, above the card on phones

  // Google animates a pan and a one-step zoom smoothly, so bigger zooms are done one step at a time

  /* ---- Labels: text, colour, selected one, and which ones fit ---- */
  refresh() {
    const sel = this.spec.selected(), pal = this.spec.palette();
    const colours = [0, 1, 2, 3, 4, 5].map(i => css(i ? `--${pal}-${i}` : "--chg-0"));
    let shown = [];
    Object.values(this.pills).forEach(p => {
      p.show = this.spec.visible(p.name);
      p.h.show(p.show);
      if (!p.show) return;
      shown.push(p.name);
      const label = this.spec.label(p.name), bg = colours[this.spec.level(p.name)];
      p.el.textContent = label;
      p.w = textW(label) + 16;
      p.sel = p.name === sel;
      p.el.classList.toggle("on", p.sel);
      p.el.style.setProperty("--pc", bg);
      p.el.style.setProperty("--pt", inkOn(bg));

    // or many appeared / disappeared
    const key = shown.join("|"), before = this.visibleKey;
    this.visibleKey = key;
    if (before !== undefined && key !== before && this.fitted) {
      const n0 = before ? before.split("|").length : 0, off = shown.some(n => !this.inView(this.pills[n].lat, this.pills[n].lon));
      if (off || Math.abs(shown.length - n0) > 0.3 * Math.max(n0, 1)) { this.home = null; this.fitAll(!!this.lm); }
    }

    if (this.gm) this.gm.setOptions({ styles: GSTYLE[theme === "dark" ? "dark" : "light"], backgroundColor: css("--surface") });
    if (this.lm) { this.tiles.setUrl(tileURL()); this.box.classList.toggle("osm-dark", !CARTO_KEY && theme === "dark"); }

  }

  /* ---- Hover / tap card ---- */
  openCard(name, pinned) {

  hideSoon() { clearTimeout(this.hideTimer); this.hideTimer = setTimeout(() => this.closeCard(), 180); }
  closeCard() { this.card = null; this.cardEl.classList.add("hidden"); }
  placeCard() {
    const el = this.cardEl;
    if (!this.card) return el.classList.remove("moving");
    const pill = this.pills[this.card.name]?.el;
    const W = this.wrap.clientWidth, H = this.wrap.clientHeight;
    let dock = W < 520;                                      // phones: the card sits along the bottom of the map
    el.classList.toggle("dock", dock);                       // (measured at its normal size first)
    if (!dock && pill) {
      const r = pill.getBoundingClientRect(), o = this.wrap.getBoundingClientRect();
      const L0 = r.left - o.left, T0 = r.top - o.top, R0 = r.right - o.left, B0 = r.bottom - o.top;
      const cx = (L0 + R0) / 2, cy = (T0 + B0) / 2, cw = el.offsetWidth, ch = el.offsetHeight, g = 8, m = 8;
      if (cx < 0 || cx > W || cy < 0 || cy > H) { el.classList.add("moving"); return; }   // the community is off the map
      // keep clear of the map buttons: switches along the top, zoom buttons down the end side

      const clampX = x => Math.min(Math.max(x0, x), x1 - cw), clampY = y => Math.min(Math.max(y0, y), H - ch - m);
      // above, below, beside (after / before): the first place where the whole card fits without covering the label
      const spots = [[clampX(cx - cw / 2), T0 - ch - g], [clampX(cx - cw / 2), B0 + g], [R0 + g, clampY(cy - ch / 2)], [L0 - g - cw, clampY(cy - ch / 2)]];
      const spot = spots.find(([x, y]) => x >= x0 && x + cw <= x1 && y >= y0 && y + ch <= H - m);

/* Move a point by some screen pixels at zoom z (Web Mercator, the projection both map types use) */
function shiftPx(lat, lon, z, dx, dy) {
  if (!dx && !dy) return [lat, lon];
  const S = 256 * 2 ** z, sn = Math.sin(lat * Math.PI / 180);
  const x = (lon + 180) / 360 * S + dx, y = (0.5 - Math.log((1 + sn) / (1 - sn)) / (4 * Math.PI)) * S + dy;
  const n = Math.PI - 2 * Math.PI * y / S;
  return [180 / Math.PI * Math.atan(Math.sinh(n)), x / S * 360 - 180];
}
/* Which line each station is on (nearest track), so its dot gets the line colour; interchanges stay black */
function colourStations() {
  const d2 = (a, b, c, d) => (a - c) ** 2 + ((b - d) * 0.9) ** 2;
  METRO.stations.forEach(s => {
    const near = new Set();
    METRO.lines.forEach(ln => {
      const best = Math.min(...ln.paths.flat().map(p => d2(s.lat, s.lon, p[0], p[1])));
      if (best < 0.0025 ** 2) near.add(ln.colour);
    });
    s.colour = near.size === 1 ? [...near][0] : "";
  });
}
async function loadMetro() {
  try {
    const d = await (await fetch("/api/metro")).json();
    if (d.lines?.length) { METRO = d; colourStations(); }
    else if (!d.ready) return setTimeout(loadMetro, 8000);           // still downloading (first start only)
  } catch { /* offline */ }
  Object.values(MAPS).forEach(M => M?.drawLayers());
}
function setLayer(name, on) {
  LAYERS[name] = on; store.set(name === "metro" ? "mapMetro" : "mapRings", on ? "1" : "0");
  Object.values(MAPS).forEach(M => M?.drawLayers());
}

// 3-year price line for the card (12 quarters of median price per sq ft)
function miniTrend(vals) {
  const v = vals.map((x, i) => [i, x]).filter(p => p[1] != null);
  if (v.length < 3) return "";
  const W = 220, H = 40, n = vals.length - 1;
  const lo = Math.min(...v.map(p => p[1])), hi = Math.max(...v.map(p => p[1]));

  const end = pts[pts.length - 1], [q0, q1] = OPT.spark_quarters;

      <path d="M${pts.map(p => p.map(k => k.toFixed(1)).join(",")).join("L")}" fill="none" stroke="var(--brand)" stroke-width="1.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    </svg><i style="inset-inline-end:${((1 - end[0] / W) * 100).toFixed(1)}%;top:${(end[1] / H * 100).toFixed(1)}%"></i>
    <span>${quarterText(q0)}</span><span>${t("priceTrend")}</span><span>${quarterText(q1)}</span></div>`;

/* ---------------- Reusable type-to-search box for community / area dropdowns ----------------
   Keeps the original <select> (hidden) as the source of truth, so the rest of the code is unchanged. */
function makeCombo(sel, { bare = false } = {}) {
  const wrap = document.createElement("div");
  wrap.className = "combo" + (bare ? " bare" : "");
  wrap.innerHTML = `<svg class="icon sm ci" aria-hidden="true"><use href="#i-search"/></svg>
    <input type="text" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="false">
    <svg class="icon sm cc" aria-hidden="true"><use href="#i-chev"/></svg>
    <ul class="combo-list hidden" role="listbox"></ul>`;
  sel.before(wrap);
  sel.classList.add("hidden");
  const input = wrap.querySelector("input"), list = wrap.querySelector("ul");
  input.id = sel.id + "Search";
  const lab = document.querySelector(`label[for="${sel.id}"]`);
  if (lab) lab.setAttribute("for", input.id);
  let items = [], idx = -1;

  const sync = () => { const o = sel.options[sel.selectedIndex]; input.value = o ? o.text : ""; };
  const close = () => { list.classList.add("hidden"); input.setAttribute("aria-expanded", "false"); };
  const draw = q => {
    if (!items.length) { list.innerHTML = `<li class="none">${t("noMatch")}</li>`; return; }
    list.innerHTML = items.map((o, i) => {
      const at = q ? o.t.toLowerCase().indexOf(q) : -1;
      const label = at < 0 ? esc(o.t) : esc(o.t.slice(0, at)) + "<mark>" + esc(o.t.slice(at, at + q.length)) + "</mark>" + esc(o.t.slice(at + q.length));
      const c = OPT.communities[o.v];
      const cats = c ? c.categories.map(x => t(x)).join(" · ") : "";
      return `<li role="option" data-i="${i}" aria-selected="${o.v === sel.value}" class="${i === idx ? "active" : ""}"><span>${label}</span><small>${cats}</small></li>`;
    }).join("");
    const a = list.querySelector(".active");                 // scroll the list (not the page) to the highlighted item
    if (a) list.scrollTop = a.offsetTop - list.clientHeight / 2 + a.offsetHeight / 2;
  };
  const open = all => {
    const q = all ? "" : input.value.trim().toLowerCase();
    items = [...sel.options].map(o => ({ v: o.value, t: o.text })).filter(o => o.t.toLowerCase().includes(q));
    idx = all ? Math.max(0, items.findIndex(o => o.v === sel.value)) : (items.length ? 0 : -1);
    list.classList.remove("hidden");                         // show first, so the list can be scrolled
    draw(q);
    input.setAttribute("aria-expanded", "true");
  };
  const choose = o => { sel.value = o.v; sync(); close(); sel.dispatchEvent(new Event("change")); };

  input.addEventListener("focus", () => { input.select(); open(true); });
  input.addEventListener("input", () => open(false));
  input.addEventListener("blur", () => setTimeout(() => { close(); sync(); }, 150));   // unmatched text is undone
  input.addEventListener("keydown", e => {
    const isOpen = !list.classList.contains("hidden");
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      if (!isOpen) return open(true);
      if (!items.length) return;
      idx = (idx + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length;
      draw(input.value.trim().toLowerCase() === (sel.options[sel.selectedIndex]?.text || "").toLowerCase() ? "" : input.value.trim().toLowerCase());
    } else if (e.key === "Enter") {
      e.preventDefault();
      if (isOpen && idx >= 0) choose(items[idx]);
    } else if (e.key === "Escape") { close(); }
  });
  list.addEventListener("mousedown", e => {
    const li = e.target.closest("li[data-i]");
    if (li) { e.preventDefault(); choose(items[+li.dataset.i]); }
  });
  return { sync };
}
/* Plain pick list for the shorter dropdowns (property type, view, ...): looks and behaves like the

const selValue = Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype, "value");
function makePick(sel, { bare = false } = {}) {
  const wrap = document.createElement("div");
  wrap.className = "pick" + (bare ? " bare" : "");
  wrap.innerHTML = `<button type="button" class="pick-btn" aria-haspopup="listbox" aria-expanded="false"><span></span></button>
    <svg class="icon sm cc" aria-hidden="true"><use href="#i-chev"/></svg>
    <ul class="combo-list hidden" role="listbox" tabindex="-1"></ul>`;
  sel.before(wrap);
  sel.classList.add("hidden");
  const btn = wrap.querySelector("button"), text = btn.querySelector("span"), list = wrap.querySelector("ul");
  btn.id = sel.id + "Pick";
  const lab = document.querySelector(`label[for="${sel.id}"]`);
  if (lab) { lab.setAttribute("for", btn.id); lab.id = lab.id || sel.id + "Label"; btn.setAttribute("aria-labelledby", `${lab.id} ${btn.id}`); }
  let idx = -1;
  const opts = () => [...sel.options];
  const sync = () => { const o = sel.options[sel.selectedIndex]; text.textContent = o ? o.text : ""; };
  const draw = () => {
    list.innerHTML = opts().map((o, i) => `<li role="option" data-i="${i}" aria-selected="${o.value === sel.value}"
      class="${i === idx ? "active" : ""}"><span>${esc(o.text)}</span>${o.value === sel.value
        ? '<svg class="icon sm tick" aria-hidden="true"><use href="#i-check"/></svg>' : ""}</li>`).join("");
    const a = list.querySelector(".active");
    if (a) list.scrollTop = a.offsetTop - list.clientHeight / 2 + a.offsetHeight / 2;
  };
  const isOpen = () => !list.classList.contains("hidden");
  const open = () => {
    document.querySelectorAll(".pick .combo-list:not(.hidden)").forEach(l => l !== list && l.dispatchEvent(new Event("close")));
    idx = Math.max(0, sel.selectedIndex);
    list.classList.remove("hidden"); btn.setAttribute("aria-expanded", "true"); draw();
  };
  const close = () => { list.classList.add("hidden"); btn.setAttribute("aria-expanded", "false"); };
  const choose = i => { const o = sel.options[i]; if (!o) return; selValue.set.call(sel, o.value); sync(); close(); btn.focus();
                        sel.dispatchEvent(new Event("change")); };
  list.addEventListener("close", close);
  btn.addEventListener("click", () => (isOpen() ? close() : open()));
  btn.addEventListener("keydown", e => {
    const n = sel.options.length;
    if (["ArrowDown", "ArrowUp", "Home", "End"].includes(e.key)) {
      e.preventDefault();
      if (!isOpen()) return open();
      idx = e.key === "Home" ? 0 : e.key === "End" ? n - 1 : (idx + (e.key === "ArrowDown" ? 1 : -1) + n) % n;
      draw();
    } else if ((e.key === "Enter" || e.key === " ") && isOpen()) { e.preventDefault(); choose(idx); }
    else if (e.key === "Escape" || e.key === "Tab") close();
    else if (e.key.length === 1 && isOpen()) {                                  // type a letter to jump
      const j = opts().findIndex(o => o.text.toLowerCase().startsWith(e.key.toLowerCase()));
      if (j >= 0) { idx = j; draw(); }
    }
  });
  list.addEventListener("mousedown", e => { const li = e.target.closest("li[data-i]"); if (li) { e.preventDefault(); choose(+li.dataset.i); } });
  document.addEventListener("mousedown", e => { if (isOpen() && !wrap.contains(e.target)) close(); });
  // keep the button text right when the code changes the value or the options
  Object.defineProperty(sel, "value", { configurable: true, get() { return selValue.get.call(this); },
                                        set(v) { selValue.set.call(this, v); sync(); } });
  new MutationObserver(sync).observe(sel, { childList: true, subtree: true, characterData: true });
  sync();
  return { sync };
}

/* ---- Find homes ----
   Filters update the results as you change them. Price is chosen on a histogram of what actually sold:
   40 log-spaced price bands (OPT.price_edges). The handles move continuously along the same log scale (0..1000),
   so they glide instead of jumping band to band; left at 0 = "no minimum", right at the end = "no maximum". */
let findState = null, lastCur = currency, lastUnit = unit;
const EDGES = OPT.price_edges, NB = EDGES.length - 1;

const P = 1000, LO = Math.log(EDGES[0]), HI = Math.log(EDGES[NB]);
const posOf = usd => Math.min(P, Math.max(0, (Math.log(usd) - LO) / (HI - LO) * P));       // price -> slider position
const usdAt = pos => Math.exp(LO + (pos / P) * (HI - LO));                              // slider position -> price

// price state -> handles, inputs, histogram colours
function syncPrice(moveHandles = true) {
  const lo = fMinUsd ? posOf(fMinUsd) : 0, hi = fMaxUsd ? posOf(fMaxUsd) : P;
  if (moveHandles) { $("fLo").value = lo; $("fHi").value = hi; }
  if (document.activeElement !== $("fMin")) $("fMin").value = fMinUsd ? money0(round3(fMinUsd * rateOf())) : "";
  if (document.activeElement !== $("fMax")) $("fMax").value = fMaxUsd ? money0(round3(fMaxUsd * rateOf())) : "";
  $("fSel").style.insetInlineStart = (lo / P * 100) + "%";

}
